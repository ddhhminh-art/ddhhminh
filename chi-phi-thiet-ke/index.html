/* =============================================================================
   Sheet 2 "Bộ môn" — sản lượng & định biên từng phòng bộ môn
   Tỷ lệ chia lấy từ bomon.js (file "TỶ LỆ BỘ MÔN.pptx"). Định biên cộng phần lẻ
   của mọi hạng mục rồi mới làm tròn lên MỘT lần cho mỗi bộ môn, giống trên app —
   làm tròn ở từng hạng mục sẽ thổi số lên nhiều lần.
   Dùng chung bảng kiểu S() với sheet 1 nên phải gọi trước khi sinh styles.xml.
   ========================================================================== */
function sheetBoMon(ds, dg, S) {
  if (typeof phanBoBoMon !== 'function') return null;
  const rows = [], merges = [];
  let R = 0;
  const push = (cells, ht) => {
    R++;
    rows.push(`<row r="${R}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>${cells.filter(Boolean).join('')}</row>`);
  };
  const cell = (ref, v, st) => {
    const s = ` s="${st}"`;
    if (v == null || v === '') return `<c r="${ref}"${s}/>`;
    if (typeof v === 'number') return isFinite(v) ? `<c r="${ref}"${s}><v>${v}</v></c>` : `<c r="${ref}"${s}/>`;
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  };

  const all = ds.flatMap((k) => k.rows || []);
  const chia = all.map(({ it, r }) => {
    const pb = phanBoBoMon(it, r);
    return { it, r, pb, db: dinhBienBoMon(r, pb, dg) };
  });
  const t = congBoMon(chia);
  const gop = dinhBienGop(chia, dg);
  if (!t.tongTien) return null;

  const stTieu  = S({ f: 'navyB', fill: 'bang1', h: 'left' });
  const stHead  = S({ f: 'navyB', fill: 'header', bd: 1, h: 'center', wrap: 1 });
  const stTen   = S({ f: 'navy', bd: 1, h: 'left' });
  const stTien  = S({ f: 'navy', bd: 1, h: 'right', fmt: 'acc2' });
  const stPc    = S({ f: 'navy', bd: 1, h: 'right', fmt: 'pc2' });
  const stNguoi = S({ f: 'navyB', bd: 1, h: 'center', fmt: 'ng' });
  const stTongT = S({ f: 'redB', fill: 'vang', bd: 1, h: 'left' });
  const stTongN = S({ f: 'redB', fill: 'vang', bd: 1, h: 'right', fmt: 'acc2' });
  const stTongP = S({ f: 'redB', fill: 'vang', bd: 1, h: 'right', fmt: 'pc2' });
  const stTongS = S({ f: 'redB', fill: 'vang', bd: 1, h: 'center', fmt: 'ng' });
  const stCap   = S({ f: 'navyB', fill: 'pk', bd: 1, h: 'left' });
  const stGhi   = S({ f: 'navy', h: 'left', v: 'top', wrap: 1 });

  push([cell('A1', ds.length > 1 ? 'SẢN LƯỢNG & ĐỊNH BIÊN THEO BỘ MÔN — TOÀN BỘ'
    : 'SẢN LƯỢNG & ĐỊNH BIÊN THEO BỘ MÔN — ' + ((ds[0].duAn || {}).ten || ''), stTieu)], 20);
  merges.push('A1:D1');
  push([]);
  push([cell('A3', 'Bộ môn', stHead), cell('B3', 'Sản lượng (đ)', stHead),
        cell('C3', 'Tỷ trọng', stHead), cell('D3', 'Định biên (người)', stHead)], 30);
  for (const k of BO_MON_KEY) {
    if (!(t.tien[k] > 0.5 || gop.nguoi[k])) continue;
    const rr = R + 1;
    push([cell('A' + rr, BO_MON[k].ten, stTen), cell('B' + rr, t.tien[k], stTien),
          cell('C' + rr, t.tien[k] / t.tongTien, stPc), cell('D' + rr, gop.nguoi[k], stNguoi)], 15.75);
  }
  const rt = R + 1;
  push([cell('A' + rt, 'TỔNG', stTongT), cell('B' + rt, t.tongTien, stTongN),
        cell('C' + rt, 1, stTongP), cell('D' + rt, gop.tongNguoi, stTongS)], 18);

  /* Phòng chủ trì (Cảnh quan, Nội thất): tiền ở lại phòng, đây là vai trò bên trong */
  const theoPhong = {};
  for (const x of chia) {
    if (!x.pb.phong) continue;
    const o = (theoPhong[x.pb.phong] ||= { ten: BO_MON[x.pb.phong].ten, vt: {}, vtTen: {} });
    for (const [k, v] of Object.entries(x.pb.vaiTro)) {
      o.vt[k] = (o.vt[k] || 0) + v;
      o.vtTen[k] = (x.pb.vaiTroTen && x.pb.vaiTroTen[k]) || BO_MON[k].ten;
    }
  }
  for (const o of Object.values(theoPhong)) {
    const tongVT = Object.values(o.vt).reduce((a, b) => a + b, 0);
    if (tongVT < 0.5) continue;
    push([]);
    const rc = R + 1;
    push([cell('A' + rc, 'Chia vai trò bên trong phòng ' + o.ten, stCap), cell('B' + rc, '', stCap), cell('C' + rc, '', stCap)], 16.5);
    merges.push(`A${rc}:C${rc}`);
    for (const [k, v] of Object.entries(o.vt)) {
      if (!(v > 0.5)) continue;
      const rr = R + 1;
      push([cell('A' + rr, o.vtTen[k], stTen), cell('B' + rr, v, stTien), cell('C' + rr, v / tongVT, stPc)], 15.75);
    }
  }

  push([]);
  const rg = R + 1;
  push([cell('A' + rg, 'Tỷ lệ chia bộ môn theo file "TỶ LỆ BỘ MÔN"; dùng chung với app Sản lượng VTK và app TMB quy hoạch. '
    + 'Định biên cộng phần lẻ của mọi hạng mục rồi mới làm tròn lên một lần cho mỗi bộ môn — làm tròn ở từng hạng mục sẽ thổi số lên nhiều lần. '
    + 'Phòng Cảnh quan và Nội thất giữ trọn tiền hạng mục của mình, bảng "chia vai trò bên trong phòng" chỉ cho biết trong phòng đó ai làm bao nhiêu.', stGhi)], 60);
  merges.push(`A${rg}:D${rg}`);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView showGridLines="0" zoomScale="85" zoomScaleNormal="85" workbookViewId="0"/></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols><col min="1" max="1" width="34.57" customWidth="1"/><col min="2" max="2" width="20.57" customWidth="1"/><col min="3" max="3" width="11.57" customWidth="1"/><col min="4" max="4" width="16.57" customWidth="1"/></cols>
<sheetData>${rows.join('')}</sheetData>
<mergeCells count="${merges.length}">${merges.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>
</worksheet>`;
}

/* =============================================================================
   Xuất
   @param ds  danh sách kết quả dự án (output của tinhDuAn)
   @param dg  bộ đơn giá dùng chung
   ========================================================================== */
function xuatExcel(ds, dg) {
  const { ds: xfs, S } = moKho();
  const rows = [], merges = [];
  let R = 0;
  const push = (cells, ht) => {
    R++;
    rows.push(`<row r="${R}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>${cells.filter(Boolean).join('')}</row>`);
  };
  const cell = (ref, v, st, f = null) => {
    const s = ` s="${st}"`;
    if (f) return `<c r="${ref}"${s}><f>${esc(f)}</f></c>`;
    if (v == null || v === '') return `<c r="${ref}"${s}/>`;
    if (typeof v === 'number') return isFinite(v) ? `<c r="${ref}"${s}><v>${v}</v></c>` : `<c r="${ref}"${s}/>`;
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  };
  /** tô kiểu cho cả dải A..AI của một hàng, kể cả ô rỗng — để nền và viền liền mạch */
  const dai = (r, st, noiDung = {}) =>
    COT.map((c, i) => cell(colLetter(i + 1) + r, noiDung[c.k], typeof st === 'function' ? st(c, i) : st));

  /* ---- hàng 1: băng tiêu đề nhóm cột ---- */
  const stBang = S({ f: 'navyB', fill: 'bang1', bd: 1, h: 'center', wrap: 1 });
  const r1 = R + 1;
  push([
    cell('A1', ds.length > 1 ? `TỔNG HỢP ${ds.length} DỰ ÁN`
        : `${ds[0].duAn.ten}${ds[0].duAn.diaDiem ? ' - ' + ds[0].duAn.diaDiem : ''}`
          + `${ds[0].vung ? ` (Vùng ${ds[0].vung})` : ''}`,
      S({ f: 'redB', h: 'left', wrap: 1 })),
    ...['ten', 'pk', 'd', 'tt', 'f', 'g', 'h', 'I', 'J', 'K', 'L', 'm', 'n', 'O', 'P', 'q', 'ghi', 's']
      .map((k) => cell(C(k) + r1, null, S({}))),
    cell(C('T') + r1, 'Chi phí thiết kế', stBang),
    ...['U', 'V', 'W', 'X'].map((k) => cell(C(k) + r1, null, stBang)),
    cell(C('y') + r1, 'Chi phí nhân công', stBang),
    ...['Z', 'AA', 'AB'].map((k) => cell(C(k) + r1, null, stBang)),
    cell(C('tC') + r1, 'Tiến độ\n(Tháng)', stBang),
    ...['tCS', 'tTC'].map((k) => cell(C(k) + r1, null, stBang)),
    cell(C('AF') + r1, 'Định biên \n(Người)', stBang),
    ...['AG', 'AH', 'AI'].map((k) => cell(C(k) + r1, null, stBang)),
    cell('AK1', 'Lương TB:', S({ f: 'redB', fill: 'bang1' })),
    cell('AL1', +dg.luongTB, S({ f: 'red', fill: 'bang1', fmt: 'acc2' })),
  ], 45);
  merges.push(`A1:${C('f')}1`, `${C('T')}1:${C('X')}1`, `${C('y')}1:${C('AB')}1`,
              `${C('tC')}1:${C('tTC')}1`, `${C('AF')}1:${C('AI')}1`);

  /* ---- hàng 2: tiêu đề cột ---- */
  push(COT.map((c, i) => cell(colLetter(i + 1) + (R + 1), c.h,
    S({ f: c.hf === 'red' ? 'redB' : 'navyB', fill: 'header', bd: 1, h: 'center', wrap: c.hwrap !== 0 ? 1 : 0 }))), 44.25);

  /* ---- kiểu ô dữ liệu theo từng cột ---- */
  const stCot = (c) => S({ fmt: c.fmt, f: c.f, fill: c.fill, bd: 1, h: c.al, wrap: c.wrap });
  const stNhom = S({ f: 'navyB', fill: 'nhom', bd: 1, h: 'center' });
  const stNhomL = S({ f: 'navyB', fill: 'nhom', bd: 1 });
  const stDA = S({ f: 'navyB', fill: 'pk', bd: 1 });
  const dongTongDA = [];

  for (const kq of ds) {
    const duAn = kq.duAn;

    if (ds.length > 1) {                       /* hàng tên dự án khi xuất nhiều dự án */
      const rr = R + 1;
      push(dai(rr, stDA, { stt: '■', ten: duAn.ten +
        (duAn.diaDiem ? `  —  ${duAn.diaDiem}${kq.vung ? ` (Vùng ${kq.vung})` : ''}` : '') }), 18);
      merges.push(`${C('ten')}${rr}:${C('tt')}${rr}`);
    }

    const dongDA = [];

    for (const [key, ma, list] of nhomCoDuLieu(kq.rows)) {
      push(dai(R + 1, (c, i) => (i === 0 ? stNhom : stNhomL),
        { stt: ma, ten: NHOM[key].ten }), 18);

      list.forEach(({ it, r }, n) => {
        const rr = R + 1;
        dongDA.push(rr);
        const suat = r.mode === 'suat';
        const v = {
          stt: n + 1, ten: it.ten || '', pk: it.pk ?? '', d: +it.d || 0,
          tt: suat ? moTaCT(it, r) : '', ghi: suat ? moTaToa(it, r) : moTaKhac(r),
          s: suat ? r.s : 1, y: r.y,
          W: r.W, tC: r.thangC, tCS: r.thangCS, tTC: r.thangTC,
        };
        if (suat) Object.assign(v, { f: r.f, g: r.g, h: r.h, m: r.m, n: r.n + r.nkt, q: r.qConcept != null ? r.qConcept : +it.q || 0 });
        else Object.assign(v, { T: r.T, U: r.U, V: r.V });

        const ct = Object.create(null);   // công thức Excel cho các ô dẫn xuất
        if (suat) {
          const L = LOAI[it.loai];
          ct.I = `${C('g')}${rr}*${C('f')}${rr}*${C('d')}${rr}`;
          ct.J = L.tbVung ? `${C('h')}${rr}*${C('f')}${rr}*${C('d')}${rr}` : `${C('h')}${rr}*${C('d')}${rr}`;
          ct.K = `${C('I')}${rr}+${C('J')}${rr}`;
          ct.L = `${C('K')}${rr}/1.1/10^9`;
          ct.O = `${C('K')}${rr}*${C('m')}${rr}`;
          ct.P = `${C('I')}${rr}*${C('n')}${rr}`;
          ct.T = `${C('q')}${rr}*${r.hsConcept}`;   // đơn giá — không nhân hệ số giảm
          ct.U = `${C('O')}${rr}*${r.hsNhanBan}*${C('s')}${rr}`;
          ct.V = `${C('P')}${rr}*${r.hsNhanBan}*${C('s')}${rr}`;
        }
        /* --- khoản người dùng đã tắt: ghi thẳng 0 và bỏ công thức.
           Mọi ô dẫn xuất (X, Z, AA, AB, AF..AI) đều tham chiếu các ô này nên
           cả bảng tính tự khớp theo, không phải sửa thêm chỗ nào. --- */
        if (suat) {
          /* Sheet không có cột TKKT riêng — TKKT gộp vào cột TKBVTC qua tỷ lệ n.
             Tắt cái nào thì trừ tỷ lệ của cái đó ra. */
          const nV = (r.tat.V ? 0 : r.n) + (r.tat.UKT ? 0 : r.nkt);
          v.n = nV;
          if (!nV) { v.V = 0; delete ct.V; }
        } else if (r.tat.V) v.V = 0;
        for (const k of ['T', 'U']) if (r.tat[k]) { v[k] = 0; delete ct[k]; }

        ct.X  = `SUM(${C('U')}${rr}:${C('W')}${rr})`;
        ct.Z  = `${C('T')}${rr}*${C('y')}${rr}`;
        ct.AA = `${C('U')}${rr}*${C('y')}${rr}`;
        ct.AB = `${C('V')}${rr}*${C('y')}${rr}`;
        /* định biên của khoản đã tắt = 0, kể cả khi người dùng đã nhập tay */
        const tatDB = { AF: r.tat.T, AG: r.tat.U, AH: r.tat.V && r.tat.UKT };
        for (const [k, tien, thang, db] of [['AF', 'Z', 'tC', it.dbC], ['AG', 'AA', 'tCS', it.dbCS],
                                            ['AH', 'AB', 'tTC', it.dbTC]]) {
          if (tatDB[k]) v[k] = 0;
          else if (db != null && db !== '') v[k] = +db;
          else ct[k] = `ROUNDUP(${C(tien)}${rr}/${C(thang)}${rr}/$AL$1,0)`;
        }
        ct.AI = `SUM(${C('AF')}${rr}:${C('AH')}${rr})`;

        push(COT.map((c, i) => cell(colLetter(i + 1) + rr, v[c.k], stCot(c), ct[c.k])), 45);
      });
    }

    /* hàng cộng dự án */
    const rt = R + 1;
    dongTongDA.push(rt);
    push(congDon(rt, dongDA, ds.length > 1 ? 'Cộng ' + duAn.ten : 'TỔNG CPTK', S, cell), 13.5);
  }

  /* ---- tổng toàn bộ + nhân sự ---- */
  const rTong = R + 1;
  if (ds.length > 1) push(congDon(rTong, dongTongDA, `TỔNG ${ds.length} DỰ ÁN`, S, cell), 13.5);
  const rT = ds.length > 1 ? rTong : dongTongDA[dongTongDA.length - 1];

  const stNhan = S({ f: 'redB', h: 'right' });
  const stSo   = S({ f: 'redB', fill: 'vang', h: 'center', fmt: 'acc2d' });
  push([cell(`${C('AH')}${R + 1}`, 'NSTK hiện tại', stNhan),
        cell(`${C('AI')}${R + 1}`, +dg.nstkHienTai, S({ f: 'red', fill: 'vang', h: 'center', fmt: 'acc2d' }))], 13.5);
  const rNs = R;
  push([cell(`${C('AH')}${R + 1}`, 'Tuyển thêm', stNhan),
        cell(`${C('AI')}${R + 1}`, null, stSo, `${C('AI')}${rT}-${C('AI')}${rNs}`)], 13.5);

  /* ---- khối đơn giá tham chiếu (mục b–g của file gốc) ---- */
  R++;
  const stMuc  = S({ f: 'navyB', fill: 'pk', h: 'right' });
  const stMucB = S({ f: 'navyB', fill: 'pk', h: 'left' });
  const stDe   = S({ f: 'navyB' });
  const stGach = S({ f: 'navy', h: 'right' });
  const stTxt  = S({ f: 'navy' });
  const stTien = S({ f: 'navy', fmt: 'acc2' });
  const stPc   = S({ f: 'navy', fmt: 'pc0' });

  const ref = [
    ['b.', 'Đơn giá thiết kế concept mẫu điển hình (NOXH – cận dưới · NOTM – mức giữa · điểm nhấn – cận trên):', null],
    ...[['caoTang', 'Cao tầng (chung cư, văn phòng)'], ['truongHoc', 'Trường học'], ['tttm', 'TTTM']].flatMap(([k, t]) =>
      Object.keys(MUC_GIA).map((m) => ['-', `${t} — ${MUC_GIA[m].ngan}:`, dg.conceptMuc[k][m]])),
    ['', 'Các mẫu biến thể: tính theo % mẫu điển hình', dg.heSoBienThe],
    ['', '', null],
    ['c.', 'Thấp tầng:', null],
    ['', 'Thiết kế concept:', null],
    ...Object.keys(dg.thapTang).map((k) => ['-', dg.thapTang[k].ten + ':', dg.thapTang[k].concept]),
    ['', 'TKCS:', null],
    ...Object.keys(dg.thapTang).map((k) => ['-', dg.thapTang[k].ten + ' (đ/m2 sàn):', dg.thapTang[k].tkcs]),
    ['', 'TKBVTC:', null],
    ...Object.keys(dg.thapTang).map((k) => ['-', dg.thapTang[k].ten + ' (đ/m2 sàn):', dg.thapTang[k].tkbvtc]),
    ['', 'Hồ sơ bán hàng:', null],
    ['-', 'Cao tầng (đ/m2 sàn):', dg.hsbhCaoTang],
    ...Object.keys(dg.thapTang).map((k) => ['-', dg.thapTang[k].ten + ' (đ/m2 sàn):', dg.thapTang[k].hsbh]),
    ['', '', null],
    ['d.', 'Nội thất — trọn gói (đ/bộ hồ sơ):', null],
    ...Object.keys(MUC_GIA).flatMap((m) => [['-', `Thiết kế concept — ${MUC_GIA[m].ngan}:`, dg.noiThat.muc[m].concept],
                                            ['-', `TKBVTC — ${MUC_GIA[m].ngan}:`, dg.noiThat.muc[m].tkbvtc]]),
    ['', '', null],
    ['e.', 'Cảnh quan:', null],
    ...Object.keys(MUC_GIA).flatMap((m) => [['-', `Thiết kế concept — ${MUC_GIA[m].ngan}:`, dg.canhQuan.muc[m].concept], ['-', `TKBVTC — ${MUC_GIA[m].ngan}:`, dg.canhQuan.muc[m].tkbvtc]]),
    ['-', 'Cảnh quan tuyến phố (% đơn giá cùng mức):', dg.canhQuan.tuyenPho, 'pc'],
    ['-', 'Công trình cảnh quan đặc biệt:', dg.canhQuan.dacBiet],
    ['', '', null],
    ['', 'Chi phí quản lý thiết kế (QLTK):', dg.ptQLTK, 'pc'],
    ['', '', null],
    ['f.', 'Thiết kế công trình lặp lại trong 1 cụm công trình', null],
    ['-', 'Hệ số công trình lặp lại:', dg.heSoLap, 'pc'],
    ['-', 'Hệ số mẫu biến thể:', dg.heSoBienThe, 'pc'],
    ['', '', null],
    ['g.', 'Căn cứ tra bảng:', null],
    ['-', 'Hệ số điều chỉnh vùng: QĐ 409/QĐ-BXD ngày 11/4/2025, Phần 4 — Bảng 100', null],
    ['-', 'Suất vốn đầu tư: QĐ 425/QĐ-BXD ngày 30/3/2026', null],
    ['-', 'Định mức thiết kế: TT 38/2026/TT-BXD, Phụ lục VIII', null],
  ];
  for (const [a, b, d, kieu] of ref) {
    const rr = R + 1;
    const muc = /^[a-g]\.$/.test(a);
    push([
      cell('A' + rr, a, muc ? stMuc : stGach),
      cell('B' + rr, b, muc ? stMucB : (a ? stTxt : stDe)),
      d != null ? cell(C('d') + rr, d, kieu === 'pc' || d < 1 ? stPc : stTien) : null,
    ], 15.75);
  }

  /* ---- sheet ---- */
  const cols = COT.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.w}" customWidth="1"/>`).join('')
             + `<col min="${NCOT + 2}" max="${NCOT + 2}" width="30.57" customWidth="1"/>`
             + `<col min="${NCOT + 3}" max="${NCOT + 3}" width="16" customWidth="1"/>`;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView showGridLines="0" tabSelected="1" zoomScale="85" zoomScaleNormal="85" workbookViewId="0">
<pane xSplit="2" ySplit="2" topLeftCell="C3" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols}</cols>
<sheetData>${rows.join('')}</sheetData>
<mergeCells count="${merges.length}">${merges.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>
</worksheet>`;

  /* Sheet 2 phải sinh TRƯỚC stylesXml vì nó ghi kiểu vào cùng kho xfs. */
  const sheet2 = sheetBoMon(ds, dg, S);

  return zip([
    { name: '[Content_Types].xml', data: CONTENT_TYPES },
    { name: '_rels/.rels', data: RELS },
    { name: 'xl/workbook.xml', data: workbookXml(ds.length > 1 ? 'Tổng hợp' : ds[0].duAn.ten || 'Chi phí thiết kế') },
    { name: 'xl/_rels/workbook.xml.rels', data: WB_RELS },
    { name: 'xl/styles.xml', data: stylesXml(xfs) },
    { name: 'xl/worksheets/sheet1.xml', data: sheet },
    { name: 'xl/worksheets/sheet2.xml', data: sheet2 || SHEET_RONG },
  ]);
}

/* Hàng cộng — bám đúng hàng 33 của file gốc:
   nhãn ở cột V, tổng chi phí ở X, nhãn "Tổng ĐB cần" ở AH, tổng định biên ở AI.
   Cả bốn ô chữ đỏ đậm, hai ô số tô nền vàng, không viền. */
function congDon(rr, dong, nhan, S, cell) {
  const stNhan = S({ f: 'redB', h: 'right' });
  const sum = (k) => `SUM(${dong.map((r) => C(k) + r).join(',')})`;
  if (!dong.length) return [cell(`${C('V')}${rr}`, nhan, stNhan)];
  return [
    cell(`${C('T')}${rr}`, null, S({ f: 'redB', fill: 'vang', fmt: 'acc3' }), sum('T')),
    cell(`${C('V')}${rr}`, nhan, stNhan),
    cell(`${C('X')}${rr}`, null, S({ f: 'redB', fill: 'vang', fmt: 'acc3' }), sum('X')),
    cell(`${C('AH')}${rr}`, 'Tổng ĐB cần', stNhan),
    cell(`${C('AI')}${rr}`, null, S({ f: 'redB', fill: 'vang', fmt: 'acc2d', h: 'center' }), sum('AI')),
  ];
}

/* ---- nội dung cột E và cột Ghi chú, viết y như file gốc ---- */
function moTaCT(it, r) {
  const p = [`- Cấp công trình: cấp ${CAP_TEN[r.cap] ? CAP_TEN[r.cap].replace('Cấp ', '') : r.cap}`];
  if (+it.soTang) p.push(`- Số tầng: ${it.soTang} tầng`);
  p.push(`- Số bước TK: ${r.buocTK} bước`);
  return p.join('\n');
}
function moTaToa(it, r) {
  /* Hạ tầng không nhân bản theo số tòa — file gốc để trống ô này, không ghi "1 tòa". */
  const p = r.nhanBan === false ? [] : [`- Tổng số tòa: ${it.ntoa ?? 1} tòa`, `- Số tòa biến thể 50%: ${it.nbt || 0} tòa`];
  if (r.buocTK === 3) p.push('- Tỷ lệ TKTC = TKKT + 55% TKKT');
  return p.join('\n');
}
const moTaKhac = (r) => r.dienGiai.map((d) => `${d[0]}: ${d[1]}`).join('\n');

function taiFile(blob, ten) {
  if (window.__dl) {
    window.__dl.save({ filename: ten, data: blob }).catch((e) => {
      if (e && e.code !== 'declined') alert('Không lưu được file: ' + (e.message || e.code));
    });
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = ten;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

</script>
<script>
/* =============================================================================
   baocao.js — Bản báo cáo in được của một dự án (hoặc toàn bộ kho)

   Gom hết những gì app đã tính vào một trang A4 liền mạch: tổng hợp tiền, suất
   vốn đầu tư và tổng mức đầu tư, định biên theo bộ môn, bảng hạng mục đầy đủ,
   cơ sở tra bảng của từng hạng mục, và các cảnh báo cần nói rõ khi trình.

   Vì sao không nhét vào file Excel: file đó đang sao đúng 35 cột A..AI của
   "Tính toán chi phí thiết kế dự án.xlsx" để còn đối chiếu — thêm cột vào là
   hỏng mục đích đó. Báo cáo là một đầu ra riêng, in ra giấy / lưu PDF.

   In: nút "In / Lưu PDF" gọi window.print(); CSS @media print trong app.css
   giấu toàn bộ giao diện, chỉ chừa #baocao.
   ========================================================================== */
'use strict';

/* ---------- tiện ích riêng của báo cáo ----------------------------------- */
const bcSo = (n) => (Math.abs(n) < 0.5 ? '–' : Math.round(n).toLocaleString('vi-VN'));
const bcTy = (n) => {
  const a = Math.abs(n);
  if (a < 0.5) return '–';
  if (a >= 1e9) return (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' triệu';
  return bcSo(n);
};
const bcPt = (n, d = 1) => (n * 100).toLocaleString('vi-VN', { maximumFractionDigits: d }) + '%';
const bcNgay = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
const bcE = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Tổng chi phí thiết kế của một bộ số — GỒM Concept (xem README mục "Tổng CPTK"). */
const bcCptk = (o) => (+o.X || 0) + (+o.T || 0);

/* ---------- các khối của báo cáo ----------------------------------------- */

/** Đầu báo cáo: tên, địa điểm, ngày lập, căn cứ pháp lý */
function bcDau(ten, noi) {
  return `<header class="bc-dau">
    <div class="bc-nho">BÁO CÁO CHI PHÍ THIẾT KẾ VÀ ĐỊNH BIÊN</div>
    <h1>${bcE(ten)}</h1>
    <div class="bc-noi">${noi}</div>
    <table class="bc-canhCu"><tr>
      <td><b>Định mức thiết kế</b><br>TT 38/2026/TT-BXD, Phụ lục VIII</td>
      <td><b>Suất vốn đầu tư</b><br>QĐ 425/QĐ-BXD ngày 30/3/2026</td>
      <td><b>Hệ số vùng</b><br>QĐ 409/QĐ-BXD ngày 11/4/2025, Bảng 100</td>
      <td><b>Lập ngày</b><br>${bcNgay(new Date())}</td>
    </tr></table>
  </header>`;
}

/** Bảng chỉ tiêu tổng hợp */
function bcTongHop(T, dg, soNguoi) {
  const ql = +dg.ptQLTK || 0;
  const d = (nhan, gt, dam) => `<tr${dam ? ' class="dam"' : ''}><td>${nhan}</td><td class="n">${gt}</td></tr>`;
  return `<section class="bc-muc">
    <h2>Chỉ tiêu tổng hợp</h2>
    <table class="bc-kv">
      ${d('Tổng diện tích sàn', bcSo(T.D) + ' m²')}
      ${d('Chi phí thiết kế — Concept', bcSo(T.T) + ' đ')}
      ${d('Chi phí thiết kế — TKCS', bcSo(T.U) + ' đ')}
      ${T.UKT ? d('Chi phí thiết kế — TKKT', bcSo(T.UKT) + ' đ') : ''}
      ${d('Chi phí thiết kế — TKBVTC', bcSo(T.V) + ' đ')}
      ${T.W ? d('Chi phí thiết kế — Hồ sơ bán hàng', bcSo(T.W) + ' đ') : ''}
      ${d('<b>TỔNG CHI PHÍ THIẾT KẾ</b>', '<b>' + bcSo(bcCptk(T)) + ' đ</b>', 1)}
      ${d(`Chi phí QLTK (${bcPt(ql, 0)})`, bcSo(bcCptk(T) * ql) + ' đ')}
      ${d('<b>SẢN LƯỢNG (thiết kế + QLTK)</b>', '<b>' + bcSo(bcCptk(T) * (1 + ql)) + ' đ</b>', 1)}
      ${T.svTong ? d('Tổng mức đầu tư (ước theo suất vốn đầu tư)', bcSo(T.svTong) + ' đ') : ''}
      ${T.svTong ? d('Chi phí thiết kế / Tổng mức đầu tư', bcPt(bcCptk(T) / T.svTong, 2)) : ''}
      ${d('Chi phí nhân công thiết kế', bcSo(T.Z + T.AA + T.AAKT + T.AB) + ' đ')}
      ${d('<b>ĐỊNH BIÊN CẦN</b>', '<b>' + soNguoi + ' người</b>', 1)}
    </table>
    <p class="bc-ghi">Chi phí thiết kế gồm cả Concept. Cột <i>X</i> của file Excel gốc không gồm Concept
      (tên đầy đủ là “Tổng Chi phí (Chưa concept)”) nên hai con số lệch nhau đúng bằng phần Concept
      ${bcSo(T.T)} đ. Định biên cộng phần lẻ của mọi hạng mục rồi mới làm tròn lên một lần cho mỗi
      bộ môn; cột ĐB của bảng hạng mục làm tròn ngay ở từng hạng mục nên cộng lại sẽ lớn hơn.</p>
  </section>`;
}

/** Bảng bộ môn: sản lượng, tỷ trọng, định biên + vai trò bên trong phòng chủ trì */
function bcBoMon(rows, dg) {
  if (typeof phanBoBoMon !== 'function') return '';
  const ds = rows.map(({ it, r }) => {
    const pb = phanBoBoMon(it, r);
    return { it, r, pb, db: dinhBienBoMon(r, pb, dg) };
  });
  const t = congBoMon(ds), gop = dinhBienGop(ds, dg);
  if (!t.tongTien) return '';

  const hang = BO_MON_KEY.filter((k) => t.tien[k] > 0.5 || gop.nguoi[k]).map((k) => `<tr>
      <td><i style="background:${BO_MON[k].mau}"></i> ${bcE(BO_MON[k].ten)}</td>
      <td class="n">${bcSo(t.tien[k])}</td>
      <td class="n">${bcPt(t.tien[k] / t.tongTien)}</td>
      <td class="n"><b>${gop.nguoi[k] || '–'}</b></td></tr>`).join('');

  /* Phòng chủ trì (Cảnh quan, Nội thất): tiền ở trọn trong phòng, đây là vai trò bên trong */
  const phong = {};
  for (const x of ds) {
    if (!x.pb.phong) continue;
    const o = (phong[x.pb.phong] ||= { ten: BO_MON[x.pb.phong].ten, vt: {}, vtTen: {} });
    for (const [k, v] of Object.entries(x.pb.vaiTro)) {
      o.vt[k] = (o.vt[k] || 0) + v;
      o.vtTen[k] = (x.pb.vaiTroTen && x.pb.vaiTroTen[k]) || BO_MON[k].ten;
    }
  }
  const trong = Object.values(phong).map((o) => {
    const tg = Object.values(o.vt).reduce((a, b) => a + b, 0);
    if (tg < 0.5) return '';
    return `<table class="bc-bang nho"><thead><tr><th colspan="3">Bên trong phòng ${bcE(o.ten)}</th></tr>
      <tr><th>Vai trò</th><th class="n">Sản lượng</th><th class="n">Tỷ trọng</th></tr></thead><tbody>
      ${Object.entries(o.vt).filter(([, v]) => v > 0.5).map(([k, v]) =>
        `<tr><td>${bcE(o.vtTen[k])}</td><td class="n">${bcSo(v)}</td><td class="n">${bcPt(v / tg)}</td></tr>`).join('')}
      </tbody></table>`;
  }).join('');

  const doan = ds.filter((x) => x.pb.doanHo).length;
  const muon = ds.filter((x) => x.pb.thieuCot.length).length;

  return `<section class="bc-muc">
    <h2>Sản lượng và định biên theo bộ môn</h2>
    <table class="bc-bang"><thead><tr><th>Bộ môn</th><th class="n">Sản lượng (đ)</th>
      <th class="n">Tỷ trọng</th><th class="n">Định biên</th></tr></thead>
      <tbody>${hang}</tbody>
      <tfoot><tr><td><b>TỔNG</b></td><td class="n"><b>${bcSo(t.tongTien)}</b></td>
        <td class="n">100%</td><td class="n"><b>${gop.tongNguoi}</b></td></tr></tfoot></table>
    ${trong}
    <p class="bc-ghi">Tỷ lệ chia theo bảng <i>Tỷ lệ bộ môn</i>, dùng chung với app Sản lượng VTK và
      TMB quy hoạch. Phòng <b>Cảnh quan</b> và <b>Nội thất</b> giữ trọn tiền hạng mục của mình —
      bảng tỷ lệ bên trong chỉ cho biết trong phòng đó ai làm bao nhiêu, không cộng thêm tiền.
      ${doan ? `<br><b>Lưu ý:</b> ${doan} hạng mục app tạm gán nhóm tỷ lệ vì bảng gốc không có loại đó.` : ''}
      ${muon ? `<br><b>Lưu ý:</b> ${muon} hạng mục bảng gốc thiếu cột tỷ lệ, tạm mượn cột hồ sơ.` : ''}</p>
  </section>`;
}

/** Bảng hạng mục đầy đủ */
function bcHangMuc(rows, kt, coW) {
  const nhom = nhomCoDuLieu(rows);
  const p = [];
  for (const [key, ma, list] of nhom) {
    p.push(`<tr class="grp"><td class="c">${ma}</td><td colspan="${2 + (kt ? 1 : 0) + (coW ? 1 : 0) + 2}">${NHOM[key].ten}</td>
      <td class="n">${bcSo(list.reduce((a, x) => a + bcCptk(x.r), 0))}</td>
      <td class="c">${list.reduce((a, x) => a + x.r.AI, 0)}</td></tr>`);
    list.forEach(({ it, r }, i) => {
      p.push(`<tr><td class="c">${i + 1}</td>
        <td>${bcE(it.ten || '(chưa đặt tên)')}<div class="bc-phu">${bcE((LOAI[it.loai] || {}).ten || it.loai)}${
          it.pk ? ' · phân kỳ ' + bcE(it.pk) : ''}</div></td>
        <td class="n">${bcSo(it.d || 0)}</td>
        <td class="n">${bcSo(r.T)}</td><td class="n">${bcSo(r.U)}</td>
        ${kt ? `<td class="n">${bcSo(r.UKT)}</td>` : ''}
        <td class="n">${bcSo(r.V)}</td>${coW ? `<td class="n">${bcSo(r.W)}</td>` : ''}
        <td class="n"><b>${bcSo(bcCptk(r))}</b></td><td class="c">${r.AI}</td></tr>`);
    });
  }
  return p.join('');
}

/** Cơ sở tra bảng của từng hạng mục */
function bcCoSo(rows) {
  const d = rows.filter((x) => x.r.mode === 'suat');
  if (!d.length) return '';
  return `<section class="bc-muc">
    <h2>Cơ sở tra bảng của từng hạng mục</h2>
    <table class="bc-bang bc-ct"><thead><tr><th>Hạng mục</th><th>Suất vốn đầu tư — QĐ 425</th>
      <th class="n">Hệ số vùng</th><th>Định mức thiết kế — TT 38</th>
      <th class="n">Suất vốn ĐT</th><th class="n">TMĐT ước (đ)</th></tr></thead><tbody>
    ${d.map(({ it, r }) => `<tr>
      <td>${bcE(it.ten || '(chưa đặt tên)')}</td>
      <td class="bc-nguon">${bcE(r.nguonSV || '')}</td>
      <td class="n">${r.f}</td>
      <td class="bc-nguon">${r.nguonDM ? `Bảng ${r.nguonDM.tkcs.bang} · ${bcE(r.nguonDM.tkcs.ghi)}<br>Bảng ${r.nguonDM.tkbvtc.bang} · ${bcE(r.nguonDM.tkbvtc.ghi)}` : 'nhập tay'}</td>
      <td class="n">${r.sv ? bcSo(r.sv) + `<div class="bc-phu">đ/${bcE(r.svDv)}</div>` : '–'}</td>
      <td class="n">${r.svTong ? bcSo(r.svTong) : '–'}</td></tr>`).join('')}
    </tbody></table>
    <p class="bc-ghi">Suất vốn đầu tư theo QĐ 425 gồm chi phí xây dựng, thiết bị, quản lý dự án,
      tư vấn đầu tư xây dựng, một số chi phí khác và thuế GTGT 10%; chưa gồm dự phòng, bồi thường
      giải phóng mặt bằng, lãi vay và vốn lưu động. Trường học được QĐ 425 công bố theo đầu cháu /
      học sinh (Bảng 3, 5, 7) nên phải khai số học sinh mới ra tổng mức đầu tư.</p>
  </section>`;
}

/** Cảnh báo cần nói rõ khi trình */
function bcCanhBao(rows) {
  const c = [];
  const chuaDiaDiem = rows.some(({ r }) => r.mode === 'suat' && !r.vung);
  if (chuaDiaDiem) c.push('Có hạng mục chưa tra được hệ số vùng — kiểm tra lại địa điểm của dự án.');
  const thieuSV = rows.filter(({ r }) => r.mode === 'suat' && !r.sv).length;
  if (thieuSV) c.push(`${thieuSV} hạng mục chưa có suất vốn đầu tư (QĐ 425 không công bố cho bảng khối chức năng) — khai tay nếu cần báo giá theo suất.`);
  const choHS = rows.filter(({ r }) => r.svDv && r.svDv !== 'm² sàn' && r.sv && !r.svQuyMo).length;
  if (choHS) c.push(`${choHS} hạng mục trường học chưa khai số học sinh nên chưa ra tổng mức đầu tư.`);
  const tat = rows.reduce((a, { r }) => a + Object.keys(r.tat || {}).filter((k) => r.tat[k]).length, 0);
  if (tat) c.push(`${tat} khoản chi phí đang bị tắt, không vào tổng.`);
  if (!c.length) return '';
  return `<section class="bc-muc"><h2>Những điểm cần lưu ý</h2>
    <ul class="bc-ul">${c.map((x) => `<li>${x}</li>`).join('')}</ul></section>`;
}

/* ---------- dựng cả báo cáo ---------------------------------------------- */
function noiDungBaoCao() {
  const motDA = choDA !== TONG_HOP;
  const kq = motDA ? kqHienTai() : null;
  const rows = motDA ? kq.rows : K.ds.flatMap((k) => k.rows);
  const T = motDA ? kq.tong : K.tong;
  const kt = rows.some(({ r }) => r.UKT > 0);
  const coW = rows.some(({ r }) => r.W > 0.5);   // cột HSBH: file gốc để trống, bỏ đi cho vừa khổ giấy
  const dg = kho.donGia;
  const soNguoi = typeof dinhBienGop === 'function'
    ? dinhBienGop(rows.map(({ it, r }) => {
        const pb = phanBoBoMon(it, r);
        return { it, r, pb, db: dinhBienBoMon(r, pb, dg) };
      }), dg).tongNguoi
    : T.AI;

  const ten = motDA ? (kq.duAn.ten || 'Dự án chưa đặt tên') : 'TOÀN BỘ KHO TÍNH';
  const noi = motDA
    ? `${bcE(kq.duAn.diaDiem || 'chưa chọn địa điểm')}${kq.vung ? ` · Vùng ${kq.vung}` : ''} · ${rows.length} hạng mục`
    : `${K.ds.length} dự án · ${rows.length} hạng mục`;

  const dsDA = motDA ? '' : `<section class="bc-muc"><h2>Theo dự án</h2>
    <table class="bc-bang"><thead><tr><th>Dự án</th><th>Địa điểm</th><th class="n">HM</th>
      <th class="n">m² sàn</th><th class="n">Tổng CPTK (đ)</th><th class="n">Tỷ trọng</th></tr></thead><tbody>
    ${K.ds.map((k) => `<tr><td>${bcE(k.duAn.ten)}</td>
      <td>${bcE(k.duAn.diaDiem || '—')}${k.vung ? ` · V${k.vung}` : ''}</td>
      <td class="n">${k.duAn.items.length}</td><td class="n">${bcSo(k.tong.D)}</td>
      <td class="n">${bcSo(bcCptk(k.tong))}</td>
      <td class="n">${bcCptk(T) ? bcPt(bcCptk(k.tong) / bcCptk(T)) : '–'}</td></tr>`).join('')}
    </tbody></table></section>`;

  const theoNhom = motDA ? kq.theoNhom : K.theoNhom;
  const bangNhom = `<table class="bc-bang nho"><thead><tr><th>Nhóm</th><th class="n">HM</th>
    <th class="n">m² sàn</th><th class="n">Tổng CPTK (đ)</th><th class="n">Tỷ trọng</th></tr></thead><tbody>
    ${Object.entries(theoNhom).map(([k, v]) => `<tr><td>${NHOM[k].ten}</td><td class="n">${v.n}</td>
      <td class="n">${bcSo(v.D)}</td><td class="n">${bcSo(bcCptk(v))}</td>
      <td class="n">${bcCptk(T) ? bcPt(bcCptk(v) / bcCptk(T)) : '–'}</td></tr>`).join('')}
    </tbody></table>`;

  const pk = motDA ? Object.entries(kq.theoPK).sort((a, b) => String(a[0]).localeCompare(String(b[0]))) : [];
  const bangPK = pk.length && !(pk.length === 1 && pk[0][0] === '—')
    ? `<table class="bc-bang nho"><thead><tr><th>Phân kỳ</th><th class="n">HM</th>
       <th class="n">m² sàn</th><th class="n">Tổng CPTK (đ)</th><th class="n">ĐB</th></tr></thead><tbody>
       ${pk.map(([k, v]) => `<tr><td>${k === '—' ? 'chưa gán' : 'Phân kỳ ' + bcE(k)}</td>
         <td class="n">${v.n}</td><td class="n">${bcSo(v.D)}</td>
         <td class="n">${bcSo(bcCptk(v))}</td><td class="n">${v.AI}</td></tr>`).join('')}
       </tbody></table>` : '';

  return `${bcDau(ten, noi)}
    ${bcTongHop(T, dg, soNguoi)}
    ${dsDA}
    ${bcBoMon(rows, dg)}
    <section class="bc-muc"><h2>Phân bổ theo nhóm${bangPK ? ' và theo phân kỳ' : ''}</h2>
      ${bangNhom}${bangPK}</section>
    <section class="bc-muc bc-ngat"><h2>Chi tiết từng hạng mục</h2>
      <table class="bc-bang bc-ct"><thead><tr><th class="c">#</th><th>Hạng mục</th><th class="n">m² sàn</th>
        <th class="n">Concept</th><th class="n">TKCS</th>${kt ? '<th class="n">TKKT</th>' : ''}
        <th class="n">TKBVTC</th>${coW ? '<th class="n">HSBH</th>' : ''}<th class="n">Tổng CPTK</th><th class="c">ĐB</th></tr></thead>
        <tbody>${bcHangMuc(rows, kt, coW)}</tbody>
        <tfoot><tr><td></td><td><b>TỔNG</b></td><td class="n">${bcSo(T.D)}</td>
          <td class="n">${bcSo(T.T)}</td><td class="n">${bcSo(T.U)}</td>
          ${kt ? `<td class="n">${bcSo(T.UKT)}</td>` : ''}
          <td class="n">${bcSo(T.V)}</td>${coW ? `<td class="n">${bcSo(T.W)}</td>` : ''}
          <td class="n"><b>${bcSo(bcCptk(T))}</b></td><td class="c">${T.AI}</td></tr></tfoot></table>
    </section>
    ${bcCoSo(rows)}
    ${bcCanhBao(rows)}
    <footer class="bc-chan">Lập bằng tool Chi phí thiết kế · ${bcNgay(new Date())}</footer>`;
}

/** Đánh số các mục theo đúng thứ tự thực tế — màn TỔNG HỢP có thêm mục "Theo dự án". */
function bcDanhSo(html) {
  let i = 0;
  return html.replace(/<h2>/g, () => `<h2>${++i}. `);
}

/** Mở màn báo cáo (phủ toàn trang, có nút in) */
function moBaoCao() {
  let o = document.getElementById('baocao');
  if (!o) {
    o = document.createElement('div');
    o.id = 'baocao';
    document.body.appendChild(o);
  }
  o.innerHTML = `<div class="bc-thanh">
      <button class="btn" id="bcDong">← Quay lại</button>
      <span class="spacer"></span>
      <button class="btn g" id="bcIn">In / Lưu PDF</button>
    </div>
    <article class="bc-giay">${bcDanhSo(noiDungBaoCao())}</article>`;
  o.hidden = false;
  document.body.classList.add('dang-baocao');
  o.querySelector('#bcDong').onclick = () => { o.hidden = true; document.body.classList.remove('dang-baocao'); };
  o.querySelector('#bcIn').onclick = () => window.print();
  o.scrollTop = 0;
}

</script>
<script>
/* =============================================================================
   app.js — Giao diện
   Kho nhiều dự án: đơn giá dùng chung, mỗi dự án có địa điểm riêng để tra
   hệ số điều chỉnh vùng theo QĐ 409.
   ========================================================================== */
'use strict';

const KEY = 'cptk.kho.v2';
const KEY_CU = 'cptk.duan.v1';   // bản một-dự-án, tự chuyển đổi khi mở lần đầu

const TONG_HOP = '__tonghop__';

let kho = napTrangThai();
let choDA = kho.duAns[0]?.id || TONG_HOP;   // dự án đang mở, hoặc màn tổng hợp
let chon = null;                            // id hạng mục đang sửa
let K = null;                               // kết quả tính toàn kho

/* ---------- trạng thái ----------------------------------------------------
   Khai báo bằng function chứ không phải const: napTrangThai() chạy ngay ở
   dòng `let kho = ...` phía trên nên cần được hoisted.                       */
function moiId() { return 'i' + Math.random().toString(36).slice(2, 9); }

/* Phiên bản ĐỊNH DẠNG DỮ LIỆU — tăng mỗi khi thêm loại hạng mục hoặc trường mới.
   File .json lưu kèm số này; mở ở máy chạy bản app cũ hơn thì báo rõ ra thay vì
   hỏng âm thầm (bản cũ không biết loại 'khac' sẽ vỡ form sửa hạng mục). */
const PHIEN_BAN = 4;   // 4: mức đơn giá (NOXH / chung / điểm nhấn), cảnh quan tuyến phố, QLTK

/* Bảng giá chuyển sang "Giả định đơn giá thiết kế ngoài QĐ 425" (10/2026). Dữ liệu lưu từ trước
   được chuyển MỘT LẦN: hạng mục còn đúng concept mặc định cũ → theo mức (NOXH, TĐC cận dưới,
   còn lại mức giữa); concept đã sửa tay → giữ nguyên số, đánh dấu "nhập tay". */
/* khai báo bằng function (hoisted) — napTrangThai() chạy trước các dòng const bên dưới */
function chuyenBangGia(k) {
  const BANG_GIA = '2026-10';
  const Q_CU = { caoTang: 400e6, tttm: 400e6, vanPhong: 400e6, mamNon: 350e6, tieuHoc: 350e6, trungHoc: 350e6 };
  if (k.bangGia === BANG_GIA) return;
  const md = donGiaMacDinh();
  const dg = k.donGia;
  if (dg.canhQuan && +dg.canhQuan.concept === 25000) dg.canhQuan.concept = md.canhQuan.concept;
  if (dg.canhQuan && +dg.canhQuan.tkbvtc === 25000) dg.canhQuan.tkbvtc = md.canhQuan.tkbvtc;
  dg.conceptMau = Object.assign({}, md.conceptMau);
  for (const d of k.duAns) for (const it of d.items) {
    if (it.mucGia) continue;
    if (coMucConcept(it.loai)) it.mucGia = it.q == null || +it.q === Q_CU[it.loai] ? mucTheoTen(it.ten) : 'tay';
    else if (it.loai === 'canhQuan' || it.loai === 'noiThat') it.mucGia = mucTheoTen(it.ten);
  }
  k.bangGia = BANG_GIA;
}

function chuanHoa(k) {
  const md = donGiaMacDinh();
  k.donGia = Object.assign(md, k.donGia || {});
  for (const key of ['thapTang', 'canhQuan', 'noiThat', 'conceptMau', 'thangMacDinh', 'conceptMuc']) {
    k.donGia[key] = Object.assign(md[key], k.donGia[key] || {});
  }
  k.donGia.canhQuan.muc = Object.assign(donGiaMacDinh().canhQuan.muc, k.donGia.canhQuan.muc || {});
  k.donGia.noiThat.muc = Object.assign(donGiaMacDinh().noiThat.muc, k.donGia.noiThat.muc || {});
  k.duAns = (k.duAns || []).map((d) => Object.assign({ id: moiId(), ten: 'Dự án mới', diaDiem: '' }, d,
    { items: (d.items || []).map((it) => Object.assign({ id: moiId() }, it)) }));
  if (!k.duAns.length) k.duAns.push({ id: moiId(), ten: 'Dự án mới', diaDiem: '', items: [] });
  chuyenBangGia(k);
  /* Nội thất chuyển sang trọn gói theo mức (6/10/2026): hạng mục cũ chưa có mức thì
     đoán theo tên — NOXH, tái định cư → cận dưới; điểm nhấn → cận trên; còn lại chung.
     Nằm ngoài chuyenBangGia vì file của người dùng đã mang nhãn bảng giá 2026-10. */
  for (const d of k.duAns) for (const it of d.items)
    if (it.loai === 'noiThat' && !MUC_GIA[it.mucGia]) it.mucGia = mucTheoTen(it.ten);
  /* Loại hạng mục bản app này chưa biết — do file lưu từ bản mới hơn. Giữ nguyên
     dữ liệu, chỉ ghi lại để báo cho người dùng, tuyệt đối không tự đổi loại. */
  k.loaiLa = [...new Set(k.duAns.flatMap((d) => d.items.map((x) => x.loai))
                               .filter((x) => x && !LOAI[x]))];
  return k;
}

/** Báo khi file mở ra mới hơn bản app đang chạy */
function canhBaoPhienBan(k, ten) {
  const moiHon = (+k.phienBan || 1) > PHIEN_BAN;
  const la = k.loaiLa || [];
  if (!moiHon && !la.length) return;
  const p = [];
  if (la.length) p.push(`có loại hạng mục bản app này chưa biết: ${la.join(', ')}`);
  if (moiHon) p.push(`file lưu từ bản dữ liệu ${k.phienBan}, app này mới tới ${PHIEN_BAN}`);
  toast(`${ten}: ${p.join(' · ')}. Mở lại artifact bằng Ctrl+F5 để lấy bản mới nhất.`, 9000);
  console.warn('Lệch phiên bản dữ liệu:', { fileLuuBan: k.phienBan, appBan: PHIEN_BAN, loaiLa: la });
}

function napTrangThai() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return chuanHoa(JSON.parse(raw));
    const cu = localStorage.getItem(KEY_CU);          // chuyển đổi từ bản cũ
    if (cu) {
      const d = JSON.parse(cu);
      return chuanHoa({ donGia: d.donGia,
        duAns: [{ ten: d.ten || 'Dự án', diaDiem: d.items?.[0]?.diaDiem || '', items: d.items }] });
    }
  } catch (e) { console.warn('Không đọc được dữ liệu đã lưu:', e); }
  return chuanHoa(JSON.parse(JSON.stringify(SEED)));
}

const luu = () => {
  try { localStorage.setItem(KEY, JSON.stringify(Object.assign({ phienBan: PHIEN_BAN }, kho))); }
  catch (e) { console.warn(e); }
};

const daHienTai = () => kho.duAns.find((d) => d.id === choDA) || null;
const kqHienTai = () => K.ds.find((x) => x.duAn.id === choDA) || null;
const itHienTai = () => daHienTai()?.items.find((x) => x.id === chon) || null;

/* ---------- tiện ích DOM -------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tien = (n) => (Math.abs(n) < 0.5 ? '–' : fmt(n));
/* "Tổng CPTK" = Concept + TKCS + TKKT + TKBVTC + HSBH. Cột X của file gốc KHÔNG
   gồm Concept (nó tên là "Tổng Chi phí (Chưa concept)"), nên lấy thẳng X ra bảng thì
   hàng không cộng ra chính nó — thấy rõ nhất ở cảnh quan / nội thất, nơi Concept bằng
   đúng TKBVTC nên tổng trông như hụt một nửa. File Excel xuất ra vẫn giữ cột X theo
   file gốc. */
const cptk = (o) => (+o.X || 0) + (+o.T || 0);
/** Số thập phân kiểu Việt Nam — dấu phẩy, không phải toFixed kiểu Anh */
const soN = (n, d) => new Intl.NumberFormat('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d }).format(+n || 0);
const so3 = (n) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 }).format(n);
const ty = (n) => {
  const a = Math.abs(n);
  if (a < 1e6) return tien(n);
  const nf = (v, d) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: d }).format(v);
  return a < 1e9 ? nf(n / 1e6, 1) + ' triệu' : nf(n / 1e9, 2) + ' tỷ';
};

function pnum(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return 0;
  const hasDot = s.includes('.'), hasCom = s.includes(',');
  if (hasDot && hasCom) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (hasCom) {
    s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  } else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, '');
  }
  const v = parseFloat(s);
  return isFinite(v) ? v : 0;
}

/* ---------- cột danh sách dự án ------------------------------------------- */
function veRail() {

/* ---------- vùng giữa ----------------------------------------------------- */
function veLeft() {
  const L = $('#left');
  L.innerHTML = '';
  if (choDA === TONG_HOP) { L.append(bangTongHop()); return; }

  const d = daHienTai();
  if (!d) { choDA = TONG_HOP; locPK = ''; return veLeft(); }
  L.append(thanhDuAn(d));
  L.append(thanhCongCu(d));
  L.append(bangHangMuc(kqHienTai()));
}

/* Thanh tên dự án + địa điểm — hệ số vùng chọn một lần cho cả dự án */
function thanhDuAn(d) {
  const kq = kqHienTai();
  const bar = el('<div class="da-bar"></div>');

  const ten = el('<input class="da-ten-in" placeholder="Tên dự án">');
  ten.value = d.ten;
  ten.onchange = () => { d.ten = ten.value.trim() || 'Dự án mới'; ve(); };

  const sel = el(`<select class="btn">${
    [['', '— chọn địa điểm —'], ...QD409_DIA_DIEM.map((x) => [x.ten, x.ten])]
      .map(([v, t]) => `<option value="${escHtml(v)}"${v === (d.diaDiem || '') ? ' selected' : ''}>${escHtml(t)}</option>`).join('')
  }</select>`);
  sel.onchange = () => { d.diaDiem = sel.value; ve(); };

  const hs = kq.rows.length && kq.rows[0].r.mode === 'suat' ? kq.rows[0].r.f : null;
  bar.append(ten,
    el('<span class="da-lb">Địa điểm</span>'), sel,
    el(`<span class="tag big">${kq.vung ? 'Vùng ' + kq.vung : '—'}</span>`),
    el(`<span class="da-hint">${kq.vung
      ? 'Hệ số vùng tra Bảng 100 QĐ 409 theo từng loại công trình' + (hs ? ` (vd nhà ở ${so3(hs)})` : '')
      : 'Chọn địa điểm để tự tra hệ số vùng'}</span>`),
    el('<span class="spacer"></span>'));

  const nb = el('<button class="btn sm">Nhân bản DA</button>');
  nb.onclick = () => {
    const c = JSON.parse(JSON.stringify(d));
    c.id = moiId(); c.ten = d.ten + ' (bản sao)';
    c.items.forEach((x) => (x.id = moiId()));
    kho.duAns.splice(kho.duAns.indexOf(d) + 1, 0, c);
    moDuAn(c.id);
  };
  const xd = el('<button class="btn sm">Xoá DA</button>');
  xd.onclick = () => {
    if (!confirm(`Xoá dự án "${d.ten}" cùng ${d.items.length} hạng mục?`)) return;
    kho.duAns.splice(kho.duAns.indexOf(d), 1);
    if (!kho.duAns.length) kho.duAns.push({ id: moiId(), ten: 'Dự án mới', diaDiem: '', items: [] });
    moDuAn(kho.duAns[0].id);
  };
  bar.append(nb, xd);
  return bar;
}

function thanhCongCu(d) {
  const t = el('<div class="toolbar"></div>');
  const pks = [...new Set(d.items.map((i) => i.pk ?? ''))].filter((v) => v !== '').sort((a, b) => a - b);
  /* Lưới an toàn: phân kỳ đang lọc mà dự án này không có (đổi dự án, xoá hạng
     mục, mở file .json khác…) thì bỏ lọc, đừng để bảng rỗng mà ô chọn vẫn
     hiện "Tất cả phân kỳ". */
  if (locPK && !pks.some((p) => String(p) === locPK)) locPK = '';
  const sel = el(`<select class="btn" style="padding:4px 8px"><option value="">Tất cả phân kỳ</option>${
    pks.map((p) => `<option value="${p}"${String(p) === locPK ? ' selected' : ''}>Phân kỳ ${p}</option>`).join('')}</select>`);
  sel.onchange = () => { locPK = sel.value; veLeft(); };

  const nut = (nhan, fn, tat) => { const b = el(`<button class="btn sm">${nhan}</button>`); b.disabled = !!tat; b.onclick = fn; return b; };
  const i = () => d.items.findIndex((x) => x.id === chon);
  const doiCho = (v) => { const a = i(), b = a + v; if (a < 0 || b < 0 || b >= d.items.length) return;
    [d.items[a], d.items[b]] = [d.items[b], d.items[a]]; ve(); };

  t.append(el('<span class="da-lb">Phân kỳ</span>'), sel, el('<span class="sep"></span>'),
    nut('+ Hạng mục', () => themHangMuc(d)),
    nut('Nhân bản', () => { const a = i(); const c = Object.assign({}, d.items[a], { id: moiId(), ten: d.items[a].ten + ' (bản sao)' });
      d.items.splice(a + 1, 0, c); chon = c.id; ve(); }, !chon),
    nut('Xoá', () => { const a = i(); if (!confirm(`Xoá "${d.items[a].ten}"?`)) return;
      d.items.splice(a, 1); chon = null; ve(); }, !chon),
    nut('↑', () => doiCho(-1), !chon), nut('↓', () => doiCho(1), !chon),
    el('<span class="sep"></span>'),
    nut('Đối chiếu file gốc', () => moDialog('Đối chiếu tra bảng với file Excel gốc', dialogDoiChieu)));
  return t;
}

let locPK = '';

/* Mở một dự án (hoặc màn TỔNG HỢP).
   Bộ lọc phân kỳ là của RIÊNG từng dự án — dự án khác có bộ phân kỳ khác, giữ
   lại bộ lọc cũ sẽ lọc rỗng mà ô chọn vẫn hiện "Tất cả phân kỳ", bấm lại đúng
   giá trị đang hiện thì không nảy sự kiện change nên không thoát ra được. */
function moDuAn(id) {
  choDA = id;
  chon = null;
  locPK = '';
  ve();
}

/* ---------- bật / tắt từng khoản chi phí của một hạng mục ------------------
   Khoản tắt vẫn tính ra số, chỉ không cộng vào tổng và không ra file Excel —
   nên ô vẫn hiện số gốc, gạch ngang, bấm lại là tính tiếp. */
function batTatKhoan(idHM, k) {
  const d = daHienTai();
  const it = d && d.items.find((x) => x.id === idHM);
  if (!it) return;
  const tat = Object.assign({}, it.tat);
  if (tat[k]) delete tat[k]; else tat[k] = true;
  if (Object.keys(tat).length) it.tat = tat; else delete it.tat;
  ve();
}

/** Một ô tiền trong bảng hạng mục — bấm được để tắt / bật khoản đó */
function oKhoan(k, r) {
  const tat = r.tat[k], goc = r.goc[k];
  const nhan = TEN_KHOAN[k];
  const tip = tat ? `${nhan} ĐANG TẮT — bấm để tính lại (${fmt(goc)} đ)`
            : goc ? `Bấm để tắt ${nhan} của hạng mục này`
                  : `${nhan}: hạng mục này không có khoản đó`;
  return `<td class="n kh${tat ? ' tat' : (r[k] ? '' : ' z')}" data-kh="${k}" title="${escHtml(tip)}">${
    tien(tat ? goc : r[k])}</td>`;
}

/* ---------- bảng hạng mục của 1 dự án ------------------------------------- */
function bangHangMuc(kq) {
  const kt = kq.coTKKT;
  const hien = kq.rows.filter(({ it }) => !locPK || String(it.pk ?? '') === locPK);
  const wrap = el('<div class="tbl-wrap"></div>');
  const t = el('<table class="grid"></table>');

  const head = ['#', 'Hạng mục', 'Loại', 'PK', 'Tổng sàn (m²)', 'Tầng/Cấp', 'Tòa',
    'Concept', 'TKCS', ...(kt ? ['TKKT'] : []), 'TKBVTC', 'HSBH', 'Tổng CPTK', 'ĐB'];
  const cls = ['c', '', '', 'c', 'n', 'c', 'c', 'n', 'n', ...(kt ? ['n'] : []), 'n', 'n', 'n', 'c'];
  /* Bề rộng theo %, cộng đúng 100 — bảng dùng table-layout:fixed nên phần dư
     chia đều theo tỷ lệ này thay vì dồn hết vào cột "Hạng mục". */
  const w = kt ? [3, 14, 10, 3, 7, 6, 6, 8, 8, 8, 8, 6, 10, 3]
               : [3, 16, 11, 3, 8, 6, 6, 9, 9, 9, 7, 10, 3];

  const p = [`<colgroup>${w.map((x) => `<col style="width:${x}%">`).join('')}</colgroup>`,
    `<thead><tr>${head.map((h, i) => `<th class="${cls[i]}">${h}</th>`).join('')}</tr></thead>`, '<tbody>'];

  for (const [key, ma, list] of nhomCoDuLieu(hien)) {
    p.push(`<tr class="grp"><td class="c">${ma}</td><td colspan="${head.length - 3}">${NHOM[key].ten}
      <span class="tag">${list.length} hạng mục</span></td>
      <td class="n">${tien(list.reduce((a, x) => a + cptk(x.r), 0))}</td>
      <td class="c">${list.reduce((a, x) => a + x.r.AI, 0)}</td></tr>`);

    list.forEach(({ it, r }, i) => {
      /* hậu tố "bt" để chữ nhỏ cùng dòng — dùng thẻ pill sẽ bị xuống dòng và làm lệch chiều cao hàng */
      /* Hạ tầng không có "số tòa" (r.nhanBan false) → để gạch ngang, đừng hiện 1. */
      const toa = r.mode === 'suat' ? (r.nhanBan === false ? '<span class="z">–</span>'
                    : (it.ntoa ?? 1) + (it.nbt ? ` <span class="phu">+${it.nbt}bt</span>` : ''))
                : r.mode === 'thapTang' ? `${it.soMau ?? 1} <span class="phu">mẫu</span>` : '';
      const qm = r.mode !== 'suat' ? ''
        : `${it.soTang ? it.soTang + 'T' : ''}${it.soHam ? '+' + it.soHam + 'H' : ''}` +
          ` <span class="tag">${r.cap}</span>${r.buocTK === 3 ? ' <span class="tag">3b</span>' : ''}`;
      p.push(`<tr class="item${chon === it.id ? ' sel' : ''}" data-id="${it.id}">
        <td class="c z">${i + 1}</td>
        <td class="nm" title="Bấm để sửa">${escHtml(it.ten || '(chưa đặt tên)')}</td>
        <td><span class="tag">${LOAI[it.loai]?.ten || it.loai}</span></td>
        <td class="c">${it.pk ?? ''}</td><td class="n">${fmt(it.d || 0)}</td>
        <td class="c">${qm}</td><td class="c">${toa}</td>
        ${oKhoan('T', r)}${oKhoan('U', r)}${kt ? oKhoan('UKT', r) : ''}${oKhoan('V', r)}${oKhoan('W', r)}
        <td class="n"><b>${tien(cptk(r))}</b></td><td class="c">${r.AI}</td></tr>`);
    });
  }

  const S = (k) => hien.reduce((a, x) => a + x.r[k], 0);
  const soTat = hien.reduce((a, x) => a + x.r.soTat, 0);
  p.push(`<tr class="tot"><td></td><td>TỔNG${locPK ? ` — phân kỳ ${locPK}` : ''}${
      soTat ? ` <span class="tag off">${soTat} khoản đang tắt</span>` : ''}</td><td></td><td></td>
    <td class="n">${fmt(hien.reduce((a, x) => a + (+x.it.d || 0), 0))}</td><td></td><td></td>
    <td class="n">${tien(S('T'))}</td><td class="n">${tien(S('U'))}</td>
    ${kt ? `<td class="n">${tien(S('UKT'))}</td>` : ''}
    <td class="n">${tien(S('V'))}</td><td class="n">${tien(S('W'))}</td>
    <td class="n">${tien(S('X') + S('T'))}</td><td class="c">${S('AI')}</td></tr></tbody>`);

  t.innerHTML = p.join('');
  $$('tr.item', t).forEach((tr) => (tr.onclick = () => { chon = tr.dataset.id; ve(); }));
  /* Bấm thẳng vào ô tiền để tắt / bật khoản đó của riêng hạng mục ấy */
  $$('tr.item td.kh', t).forEach((td) => (td.onclick = (e) => {
    e.stopPropagation();
    batTatKhoan(td.closest('tr').dataset.id, td.dataset.kh);
  }));
  if (!hien.length) wrap.append(el('<div class="rong">Chưa có hạng mục nào. Bấm <b>+ Hạng mục</b> để thêm.</div>'));
  wrap.append(t);
  return wrap;
}

function kpi(lb, val, cls) {
  return el(`<div class="kpi"><span class="lb">${lb}</span><b class="${cls || ''}">${val}</b></div>`);
}

function cardTongHopKho() {
  const T = K.tong;
  const wrap = document.createElement('div');
  const c = el('<div class="card"><h3>Tổng hợp toàn bộ</h3><div class="body"></div></div>');
  const b = $('.body', c);
  b.append(kpi('Số dự án', K.ds.length));
  b.append(kpi('Tổng chi phí thiết kế (chưa concept)', ty(T.X), 'big'));
  b.append(kpi('Chi phí Concept', ty(T.T)));
  b.append(kpi('TỔNG CỘNG', ty(T.tongCong), 'big'));
  b.append(kpi(`Chi phí QLTK (${soN((+kho.donGia.ptQLTK || 0) * 100, 0)}%)`, ty(T.tongCong * (+kho.donGia.ptQLTK || 0))));
  b.append(kpi('Sản lượng (TK + QLTK)', ty(T.tongCong * (1 + (+kho.donGia.ptQLTK || 0))), 'big'));
  b.append(kpi('Tổng m² sàn', fmt(T.D) + ' m²'));
  if (T.svTong) {
    b.append(kpi('Tổng mức đầu tư (ước theo suất vốn ĐT)', ty(T.svTong)));
    b.append(kpi('Chi phí thiết kế / TMĐT', soN(T.tongCong / T.svTong * 100, 2) + '%'));
  }
  b.append(el('<div style="height:8px"></div>'));
  b.append(kpi('Chi phí nhân công', ty(T.Z + T.AA + T.AAKT + T.AB)));
  /* Định biên lấy đúng con số của bảng Theo bộ môn bên dưới: cộng phần lẻ của mọi
     hạng mục rồi mới làm tròn lên MỘT lần cho mỗi bộ môn. Cộng cột AI (làm tròn lên
     ở từng hạng mục rồi mới cộng) thổi số lên gấp ba — kho M7 Đan Phượng: 143 vs 48. */
  const dbK = dinhBienGop(dsBoMon(K.ds.flatMap((k) => k.rows)), kho.donGia).tongNguoi;
  b.append(kpi('Tổng định biên cần', dbK + ' người'));
  b.append(kpi('NSTK hiện tại', kho.donGia.nstkHienTai));
  const themK = Math.max(0, dbK - (+kho.donGia.nstkHienTai || 0));
  b.append(kpi('Cần tuyển thêm', themK, themK ? 'bad' : 'ok'));
  wrap.append(c);

  const rows = K.ds.map((k) => `<tr><td>${escHtml(k.duAn.ten)}</td>
    <td class="n">${ty(cptk(k.tong))}</td><td class="n">${k.tong.AI}</td>
    <td class="n">${cptk(T) ? soN(cptk(k.tong) / cptk(T) * 100, 1) : 0}%</td></tr>`).join('');
  wrap.append(el(`<div class="card"><h3>Theo dự án</h3><div class="body"><table class="mini">
    <thead><tr><th>Dự án</th><th class="n">Tổng CPTK</th><th class="n">ĐB</th><th class="n">%</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`));

  wrap.append(cardBoMon(K.ds.flatMap((k) => k.rows), 'Theo bộ môn — toàn bộ'));
  wrap.append(cardTheoNhom(K.theoNhom, cptk(T)));
  return wrap;
}

function cardTongHopDuAn() {
  const kq = kqHienTai();
  if (!kq) return el('<div></div>');
  const T = kq.tong;
  const wrap = document.createElement('div');
  const c = el(`<div class="card"><h3>${escHtml(kq.duAn.ten)}</h3><div class="body"></div></div>`);
  const b = $('.body', c);
  b.append(kpi('Địa điểm', kq.duAn.diaDiem ? `${escHtml(kq.duAn.diaDiem)} · Vùng ${kq.vung}` : '—'));
  b.append(kpi('Tổng chi phí thiết kế (chưa concept)', ty(T.X), 'big'));
  b.append(kpi('Chi phí Concept', ty(T.T)));
  b.append(kpi('TỔNG CỘNG', ty(T.tongCong), 'big'));
  b.append(kpi(`Chi phí QLTK (${soN((+kho.donGia.ptQLTK || 0) * 100, 0)}%)`, ty(T.tongCong * (+kho.donGia.ptQLTK || 0))));
  b.append(kpi('Sản lượng (TK + QLTK)', ty(T.tongCong * (1 + (+kho.donGia.ptQLTK || 0))), 'big'));
  b.append(kpi('Tổng m² sàn', fmt(T.D) + ' m²'));
  if (T.svTong) {
    b.append(kpi('Tổng mức đầu tư (ước theo suất vốn ĐT)', ty(T.svTong)));
    b.append(kpi('Chi phí thiết kế / TMĐT', soN(T.tongCong / T.svTong * 100, 2) + '%'));
  }
  /* Định biên lấy đúng con số của bảng Theo bộ môn bên dưới: cộng phần lẻ của mọi
     hạng mục rồi mới làm tròn lên MỘT lần cho mỗi bộ môn. Cộng cột AI (làm tròn lên
     ở từng hạng mục rồi mới cộng) thổi số lên gấp ba — kho M7 Đan Phượng: 143 vs 48. */
  b.append(kpi('Định biên cần', dinhBienGop(dsBoMon(kq.rows), kho.donGia).tongNguoi + ' người'));
  wrap.append(c);

  const pk = Object.entries(kq.theoPK).sort((a, b2) => String(a[0]).localeCompare(String(b2[0])));
  if (pk.length > 1 || (pk[0] && pk[0][0] !== '—')) {
    wrap.append(el(`<div class="card"><h3>Theo phân kỳ</h3><div class="body"><table class="mini">
      <thead><tr><th>Phân kỳ</th><th class="n">HM</th><th class="n">m² sàn</th><th class="n">Tổng CPTK</th><th class="n">ĐB</th></tr></thead>
      <tbody>${pk.map(([k, v]) => `<tr><td>${k === '—' ? '—' : 'PK ' + k}</td><td class="n">${v.n}</td>
        <td class="n">${fmt(v.D)}</td><td class="n">${ty(cptk(v))}</td><td class="n">${v.AI}</td></tr>`).join('')}
      </tbody></table></div></div>`));
  }
  wrap.append(cardBoMon(kq.rows, 'Theo bộ môn'));
  wrap.append(cardTheoNhom(kq.theoNhom, cptk(T)));
  wrap.append(el(`<div class="card"><div class="body note">
    Bấm tên hạng mục ở bảng để sửa thông số và xem diễn giải từng bước tính.<br><br>
    Địa điểm chọn một lần cho cả dự án ở thanh trên; hệ số vùng tra
    <b>Bảng 100 QĐ 409</b> riêng theo từng loại công trình.</div></div>`));
  return wrap;
}

/* ---------- sản lượng & định biên theo bộ môn ----------------------------
   Tỷ lệ chia lấy từ bomon.js (file "TỶ LỆ BỘ MÔN.pptx"). Dùng chung với app
   TMB quy hoạch và app Sản lượng VTK, sửa một chỗ cả ba nơi đổi theo. */
function dsBoMon(rows) {
  return rows.map(({ it, r }) => {
    const pb = phanBoBoMon(it, r);
    return { it, r, pb, db: dinhBienBoMon(r, pb, kho.donGia) };
  });
}

/** Bảng bộ môn cho cả dự án / cả kho — định biên GỘP rồi mới làm tròn một lần */
function cardBoMon(rows, tieuDe) {
  const ds = dsBoMon(rows);
  const t = congBoMon(ds);
  const gop = dinhBienGop(ds, kho.donGia);
  if (!t.tongTien) return el('<div></div>');

  const hang = BO_MON_KEY.filter((k) => t.tien[k] > 0.5 || gop.nguoi[k]).map((k) => `<tr>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${BO_MON[k].mau};margin-right:6px"></span>${BO_MON[k].ten}</td>
      <td class="n">${ty(t.tien[k])}</td>
      <td class="n">${soN(t.tien[k] / t.tongTien * 100, 1)}%</td>
      <td class="n"><b>${gop.nguoi[k]}</b></td></tr>`).join('');

  /* Hạng mục nào app phải đoán hộ nhóm tỷ lệ, hoặc dùng cột lệch 100% */
  const doan = ds.filter((x) => x.pb.doanHo).length;
  const lech = ds.filter((x) => x.pb.lechCot.length).length;
  const muon = ds.filter((x) => x.pb.thieuCot.length).length;

  /* Phòng chủ trì (Cảnh quan, Nội thất): gom vai trò bên trong từng phòng */
  const theoPhong = {};
  for (const x of ds) {
    if (!x.pb.phong) continue;
    const o = (theoPhong[x.pb.phong] ||= { ten: BO_MON[x.pb.phong].ten, vt: {}, vtTen: {} });
    for (const [k, v] of Object.entries(x.pb.vaiTro)) {
      o.vt[k] = (o.vt[k] || 0) + v;
      o.vtTen[k] = (x.pb.vaiTroTen && x.pb.vaiTroTen[k]) || BO_MON[k].ten;
    }
  }
  const bangPhong = Object.values(theoPhong).map((o) => {
    const tongVT = Object.values(o.vt).reduce((a, b) => a + b, 0);
    if (tongVT < 0.5) return '';
    return `<div class="cap" style="margin-top:10px">Bên trong phòng <b>${escHtml(o.ten)}</b></div>
      <table class="mini"><tbody>${Object.entries(o.vt).filter(([, v]) => v > 0.5)
        .map(([k, v]) => `<tr><td>${escHtml(o.vtTen[k])}</td><td class="n">${ty(v)}</td>
          <td class="n">${soN(v / tongVT * 100, 1)}%</td></tr>`).join('')}</tbody></table>`;
  }).join('');

  return el(`<div class="card"><h3>${tieuDe}</h3><div class="body">
    <table class="mini"><thead><tr><th>Bộ môn</th><th class="n">Sản lượng</th>
      <th class="n">%</th><th class="n">Định biên</th></tr></thead>
      <tbody>${hang}</tbody>
      <tfoot><tr><td><b>TỔNG</b></td><td class="n"><b>${ty(t.tongTien)}</b></td>
        <td class="n">100%</td><td class="n"><b>${gop.tongNguoi}</b></td></tr></tfoot></table>
    ${bangPhong}
    <div class="src">Định biên cộng phần lẻ của mọi hạng mục rồi mới làm tròn lên
      <b>một lần cho mỗi bộ môn</b> — làm tròn ở từng hạng mục sẽ thổi số lên nhiều lần.
      ${doan ? `<br><b class="bad">${doan} hạng mục</b> app đang đoán hộ nhóm tỷ lệ, mở ra chọn lại cho đúng.` : ''}
      ${lech ? `<br><b class="bad">${lech} hạng mục</b> dùng cột tỷ lệ cộng lệch 100% trong file gốc, app đã chuẩn hoá.` : ''}
      ${muon ? `<br><b class="bad">${muon} hạng mục</b> thuộc nhóm bản gốc không có cột TK concept — app mượn cột Hồ sơ để không mất tiền.` : ''}
    </div></div></div>`);
}

function cardTheoNhom(theoNhom, tongX) {
  const rows = Object.entries(theoNhom).map(([k, v]) => `<tr><td>${NHOM[k].ten}</td>
    <td class="n">${v.n}</td><td class="n">${ty(cptk(v))}</td>
    <td class="n">${tongX ? soN(cptk(v) / tongX * 100, 1) : 0}%</td></tr>`).join('');
  return el(`<div class="card"><h3>Theo nhóm</h3><div class="body"><table class="mini">
    <thead><tr><th>Nhóm</th><th class="n">HM</th><th class="n">Tổng CPTK</th><th class="n">%</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`);
}

function cardNgan() {
  const kq = kqHienTai(), T = kq.tong;
  return el(`<div class="card"><h3>${escHtml(kq.duAn.ten)}</h3><div class="body">
    <div class="kpi"><span class="lb">Tổng CPTK</span><b class="big">${ty(cptk(T))}</b></div>
    <div class="kpi"><span class="lb">Chưa gồm Concept</span><b>${ty(T.X)}</b></div>
    <div class="kpi"><span class="lb">Định biên</span><b>${T.AI} người</b></div>
  </div></div>`);
}

/* ---------- form sửa hạng mục -------------------------------------------- */
function formHangMuc() {
  const it = itHienTai();
  if (!it) { chon = null; return el('<div></div>'); }
  const d = daHienTai();
  /* Loại lạ (file lưu từ bản app mới hơn): báo ra và dừng, đừng để cả trang vỡ */
  if (!LOAI[it.loai]) {
    return el(`<div class="card"><h3>Không đọc được hạng mục</h3><div class="body">
      <div class="note"><b class="bad">Loại "${escHtml(it.loai)}" không có trong bản app này.</b><br>
      File .json được lưu từ một bản app mới hơn. Số liệu của hạng mục
      <b>${escHtml(it.ten || '(chưa đặt tên)')}</b> vẫn còn nguyên trong file, chỉ là bản này
      chưa biết cách tính. Mở lại artifact bằng Ctrl+F5 để lấy bản mới nhất.</div>
    </div></div>`);
  }
  const r = tinhHangMuc(it, kho.donGia, d);
  const L = LOAI[it.loai];
  const mode = L.mode;

  const card = el('<div class="card"><h3>Sửa hạng mục</h3><div class="body"></div></div>');
  const b = $('.body', card);
  const set = (k, v) => { it[k] = v; ve(); };
  const fT = (lbl, k, hint) => fld(lbl, 'text', it[k] ?? '', (v) => set(k, v), hint);
  const fN = (lbl, k, hint, def) => fld(lbl, 'num', it[k] ?? (def ?? ''), (v) => set(k, v === '' ? null : pnum(v)), hint);
  const fP = (lbl, k, hint, def) => fld(lbl, 'pct', it[k] ?? def, (v) => set(k, v === '' ? null : pnum(v) / 100), hint);
  const fs = (legend) => { const f = el(`<fieldset><legend>${legend}</legend><div class="f"></div></fieldset>`); b.append(f); return [f, $('.f', f)]; };

  /* Chọn hạng mục này tính những khoản nào — tắt khoản nào thì khoản đó
     không vào tổng, không ra file Excel, định biên cũng về 0. */
  const [gk, ck] = fs('Tính khoản nào cho hạng mục này');
  for (const k of khoanCua(mode, r.buocTK, it)) {
    ck.append(chk(`${TEN_KHOAN[k]}${r.goc[k] ? ` — ${ty(r.goc[k])}` : ''}`, !r.tat[k],
      () => batTatKhoan(it.id, k)));
  }
  gk.append(el(`<div class="src">${r.soTat
    ? `Đang tắt <b>${KHOAN.filter((x) => r.tat[x]).map((x) => TEN_KHOAN[x]).join(', ')}</b>` +
      ` — bớt ${ty(KHOAN.filter((x) => r.tat[x]).reduce((a, x) => a + r.goc[x], 0))} khỏi tổng.`
    : 'Đang tính đủ mọi khoản. Bỏ tích khoản nào thì khoản đó không vào tổng và không ra file Excel.'
  }</div>`));

  /* Bộ môn: chọn nhóm tỷ lệ rồi xem luôn hạng mục này chia cho ai bao nhiêu */
  const pbIt = phanBoBoMon(it, r);
  const dbIt = dinhBienBoMon(r, pbIt, kho.donGia);
  const [gbm, cbm] = fs('Sản lượng theo bộ môn');
  if (LA_THAP_TANG[it.loai] && !it.nhomBM) {
    cbm.append(fld('Gói hoàn thiện', 'select', it.goiTT || 'thapTho', (v) => set('goiTT', v),
      'ba gói cho tỷ lệ Kiến trúc khác hẳn nhau', Object.entries(GOI_THAP_TANG)));
  }
  cbm.append(fld('Nhóm tỷ lệ', 'select', it.nhomBM || '', (v) => set('nhomBM', v || null),
    it.nhomBM ? 'đang chọn tay' : 'theo loại hạng mục',
    [['', `— tự theo loại: ${TY_LE_BO_MON[nhomBoMon(Object.assign({}, it, { nhomBM: null }))].ten} —`],
     ...Object.entries(TY_LE_BO_MON).map(([k, v]) => [k, v.ten])]));
  const hangBM = BO_MON_KEY.filter((k) => pbIt.tien[k] > 0.5).map((k) => `<tr>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${BO_MON[k].mau};margin-right:6px"></span>${BO_MON[k].ten}</td>
      <td class="n">${fmt(pbIt.tien[k])}</td><td class="n">${dbIt.tong[k] || '–'}</td></tr>`).join('');
  gbm.append(el(`<table class="mini" style="margin-top:6px"><thead><tr><th>Bộ môn</th>
      <th class="n">Sản lượng</th><th class="n">Định biên</th></tr></thead><tbody>${hangBM}</tbody></table>`));
  if (pbIt.phong && Object.keys(pbIt.vaiTro).length) {
    const hangVT = Object.entries(pbIt.vaiTro).filter(([, v]) => v > 0.5).map(([k, v]) => `<tr>
        <td>${escHtml((pbIt.vaiTroTen && pbIt.vaiTroTen[k]) || BO_MON[k].ten)}</td>
        <td class="n">${fmt(v)}</td></tr>`).join('');
    /* Bọc trong MỘT thẻ: el() chỉ lấy phần tử gốc đầu tiên, truyền hai thẻ thì
       cái thứ hai bị rụng mất. */
    gbm.append(el(`<div><div class="cap" style="margin-top:9px">Chia vai trò bên trong phòng
        <b>${escHtml(BO_MON[pbIt.phong].ten)}</b></div>
      <table class="mini"><thead><tr><th>Vai trò</th><th class="n">Sản lượng</th></tr></thead>
        <tbody>${hangVT}</tbody></table></div>`));
  }
  gbm.append(el(`<div class="src">${escHtml(pbIt.nhomTen)}
    ${pbIt.doanHo ? ' — <b class="bad">bản gốc không có loại này, app đang đoán hộ</b>' : ''}
    ${pbIt.ghiChu ? '<br>' + escHtml(pbIt.ghiChu) : ''}
    ${pbIt.phong ? `<br>Toàn bộ tiền hạng mục này thuộc <b>phòng ${escHtml(BO_MON[pbIt.phong].ten)}</b>;
       bảng tỷ lệ chia việc bên trong phòng, không chia sang phòng khác.` : ''}
    ${pbIt.lechCot.length ? '<br>Cột lệch 100%: ' + escHtml(pbIt.lechCot.join(', ')) : ''}
    ${pbIt.thieuCot.length ? '<br><b class="bad">Bản gốc không có cột ' + escHtml(pbIt.thieuCot.join(', '))
       + '</b> — app tạm mượn cột Hồ sơ để không mất tiền.' : ''}
    <br>Định biên ở đây làm tròn lên trong phạm vi một hạng mục; số dùng để lên
    kế hoạch là bảng <b>Theo bộ môn</b> ở màn tổng hợp.</div>`));

  const [, c1] = fs('Thông tin chung');
  c1.append(fT('Tên hạng mục', 'ten'));
  c1.append(fld('Loại', 'select', it.loai, (v) => { doiLoai(it, v); ve(); },
    null, Object.entries(LOAI).map(([k, x]) => [k, x.ten])));
  c1.append(fN('Phân kỳ', 'pk'));
  c1.append(fN('Quy mô (m² sàn)', 'd'));

  if (mode === 'suat') {
    const [g0, w] = fs('Thông số công trình');
    w.append(fld('Cấp công trình', 'select', it.capCT || L.capMD || 'I', (v) => set('capCT', v),
      'chọn cột trong bảng 2.7–2.16', CAP_CT.map((c) => [c, CAP_TEN[c]])));
    w.append(fld('Số bước thiết kế', 'select', String(it.buocTK || 2), (v) => set('buocTK', +v), null,
      [['2', '2 bước — TKCS + TKBVTC'], ['3', '3 bước — TKCS + TKKT + TKBVTC']]));
    if (L.bangQD === 'htkt') {
      w.append(fN('Diện tích (ha)', 'dienTichHa', 'để trống = m² sàn ÷ 10.000', (+it.d || 0) / 10000));
    } else if (L.bangQD === 'nhaRiengLe') {
      w.append(fld('Kiểu nhà', 'select', it.kieuNha || '11120.03', (v) => set('kieuNha', v), null,
        QD_NHA_RIENG_LE.kieu.map((k) => [k.ma, k.ten])));
      w.append(fN('Diện tích XD 1 căn (m²)', 'dtXD'));
      w.append(fN('Số tầng hầm', 'soHam', '0 hoặc 1', 0));
    } else if (QD_KHOI[L.bangQD]) {
      w.append(fld('Khối chức năng', 'select', it.khoiCN || 'hocTap', (v) => set('khoiCN', v), null,
        QD_KHOI[L.bangQD].khoi.map((k) => [k.id, k.ten])));
    } else {
      w.append(fN('Số tầng', 'soTang'));
      w.append(fN('Số tầng hầm', 'soHam', '0 – 5', 0));
    }
    g0.append(el(`<div class="src">Hệ số vùng <b>${so3(r.f)}</b> — ${escHtml(r.nguonVung || '')}` +
      `<br>Đổi địa điểm ở thanh trên cùng của dự án.</div>`));
    if (it.autoVung === false) $('.f', g0).append(fN('Hệ số vùng (nhập tay)', 'f'));
    $('.f', g0).append(chk('Tự tra hệ số vùng QĐ 409', it.autoVung !== false, (v) => set('autoVung', v)));

    const [g1, x] = fs('Suất vốn đầu tư — QĐ 425/QĐ-BXD');
    x.append(chk('Tự tra bảng QĐ 425', it.autoSuat !== false, (v) => set('autoSuat', v)));
    x.append(ro('Quy mô', fmt(it.d || 0) + ' m² sàn'));
    if (it.autoSuat === false) { x.append(fN('CP xây dựng /m² sàn', 'g')); x.append(fN('CP thiết bị /m² sàn', 'h')); }
    else { x.append(ro('CP xây dựng /m² sàn', fmt(r.g))); x.append(ro('CP thiết bị /m² sàn', fmt(r.h))); }
    g1.append(el(`<div class="src">${escHtml(r.nguonSV || '')}</div>`));

    /* ---- Suất vốn đầu tư: KHÔNG tham gia chuỗi tính chi phí thiết kế, để riêng cho
       những hợp đồng đòi báo giá theo suất đầu tư. QĐ 425 công bố nó ở cột đầu của
       bảng suất vốn (gồm cả QLDA, tư vấn, chi phí khác và VAT 10%); riêng trường học
       thì công bố theo đầu cháu / học sinh (Bảng 3, 5, 7) nên phải khai số học sinh. */
    const [g1b, xs] = fs('Suất vốn đầu tư (để báo giá)');
    if (r.svDv !== 'm² sàn') xs.append(fN(`Số ${r.svDv}`, 'soHS'));
    xs.append(fN(`Suất vốn đầu tư (đ/${r.svDv})`, 'svTay', 'để trống = theo QĐ 425'));
    if (!it.svTay) xs.append(ro(`Theo QĐ 425 (đ/${r.svDv})`, r.sv ? fmt(r.sv) : '— chưa công bố —'));
    xs.append(ro('Tổng mức đầu tư (ước)', r.svTong ? tien(r.svTong) : '–'));
    if (r.svTong) xs.append(ro('Chi phí thiết kế / TMĐT', soN(r.X / r.svTong * 100, 2) + '%'));
    g1b.append(el(`<div class="src">${r.sv
      ? escHtml(r.nguonSv || '') + ' — suất vốn đầu tư gồm chi phí xây dựng, thiết bị, QLDA, tư vấn, chi phí khác và <b>VAT 10%</b>; chưa gồm dự phòng, GPMB, lãi vay.'
      : 'QĐ 425 chỉ công bố suất vốn đầu tư cho bảng tính theo toàn công trình. Hạng mục này tra bảng <b>khối chức năng</b> (Bảng 4, 6, 8, 16) nên không có cột đó — khai tay nếu cần báo giá.'}</div>`));

    const [g2, z0] = fs('Định mức thiết kế — TT 38/2026');
    z0.append(chk('Tự tra bảng TT 38', it.autoDinhMuc !== false, (v) => set('autoDinhMuc', v)));
    z0.append(ro('Giá trị tra định mức (chưa VAT)', soN(r.Lty, 2) + ' tỷ đ'));
    if (it.autoDinhMuc === false) {
      z0.append(fP('Tỷ lệ TKCS (%)', 'm'));
      if (r.buocTK === 3) z0.append(fP('Tỷ lệ TKKT (%)', 'nkt'));
      z0.append(fP('Tỷ lệ TKBVTC (%)', 'n'));
    } else {
      z0.append(ro('Tỷ lệ TKCS', pct(r.m)));
      if (r.buocTK === 3) z0.append(ro('Tỷ lệ TKKT', pct(r.nkt)));

  if (mode !== 'khac') {          // loại Khác đã có ô nhập tiền riêng ở trên

  const dgRows = r.dienGiai.map(([a, c, v, u]) =>
    `<tr><td>${escHtml(a)}</td><td>${escHtml(c)}</td><td>${
      u === '×' ? so3(v) + ' ×'

      : v == null ? '' : fmt(v)}</td></tr>`).join('');
  b.append(el(`<fieldset><legend>Diễn giải</legend><table class="dg">${dgRows}
    <tr class="dg-tot"><td colspan="2">Tổng CPTK</td><td>${fmt(r.X)}</td></tr>
    <tr class="dg-tot"><td colspan="2">Gồm cả Concept</td><td>${fmt(r.X + r.T)}</td></tr></table></fieldset>`));

  const xong = el('<button class="btn">Xong</button>');
  xong.onclick = () => { chon = null; ve(); };
  b.append(xong);
  return card;
}

function doiLoai(it, v) {
  it.loai = v;
  const L = LOAI[v];
  if (L.mode === 'suat') {
    if (it.q == null) it.q = L.q;
    if (coMucConcept(v)) it.mucGia ??= mucTheoTen(it.ten) === 'giua' ? (kho.donGia.mucMacDinh || 'giua') : mucTheoTen(it.ten);
    it.s = L.s;
    it.ntoa ??= 1; it.nbt ??= 0;
    it.capCT = L.capMD; it.buocTK ??= 2;
    it.soHam ??= 0; it.soTang ??= 1; it.khoiCN ??= 'hocTap';
    if (L.bangQD === 'nhaRiengLe') it.kieuNha ??= '11120.03';
  } else if (L.mode === 'canhQuan') {
    if (!L.db) it.mucGia ??= mucTheoTen(it.ten) === 'giua' ? (kho.donGia.mucMacDinh || 'giua') : mucTheoTen(it.ten);
  } else if (L.mode === 'khac') {
    it.gdKhac ??= 'V'; it.tienKhac ??= 0;
  } else {
    if (L.mode === 'thapTang') it.soMau ??= 1;
    if (L.mode === 'noiThat') it.mucGia ??= mucTheoTen(it.ten);   // trọn gói theo mức
  }
}

/* ---------- widget ------------------------------------------------------- */
function fld(label, kind, val, onChange, hint, opts) {
  const d = el(`<div class="fld"><label>${escHtml(label)}</label></div>`);
  let inp;
  if (kind === 'select') {
    inp = el(`<select>${opts.map(([k, t]) => `<option value="${escHtml(k)}"${k === val ? ' selected' : ''}>${escHtml(t)}</option>`).join('')}</select>`);
    const datTitle = () => (inp.title = inp.selectedOptions[0]?.textContent || '');
    datTitle();
    inp.onchange = () => { datTitle(); onChange(inp.value); };
  } else {
    inp = el('<input type="text">');
    inp.value = kind === 'pct' ? (val === '' || val == null ? '' : +(val * 100).toFixed(6))
              : kind === 'num' ? (val === '' || val == null ? '' : fmt0(val)) : (val ?? '');
    inp.onfocus = () => inp.select();
    inp.onchange = () => onChange(inp.value.trim());
  }
  d.append(inp);
  if (hint) d.append(el(`<span class="hint">${escHtml(hint)}</span>`));
  return d;
}
const fmt0 = (v) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 6 }).format(v);

/* Ô tích chiếm trọn bề ngang của lưới 2 cột — nếu để trong một ô thì nhãn dài
   bị cắt và cột còn lại thành khoảng trống. */
function chk(label, val, onChange) {
  const d = el('<div class="fld wide"></div>');
  const w = el('<label class="cbx"></label>');
  const i = el('<input type="checkbox">');
  i.checked = !!val;
  i.onchange = () => onChange(i.checked);
  w.append(i, document.createTextNode(label));
  d.append(w);
  return d;
}

function ro(label, txt) {
  const d = el(`<div class="fld"><label>${escHtml(label)}</label></div>`);
  const i = el('<input type="text" class="ro" readonly>');
  i.value = txt; i.title = txt;
  d.append(i);
  return d;
}

    Riêng <b>Trường THCS - GD4</b>: file gốc ghi 2,6863% nhưng B2.8 cấp III tại 31,22 tỷ phải là
    <b>2,7742%</b> — một ô gõ nhầm trong file cũ.</div>`));
}

/* Thử sửa file .json hỏng nhẹ.
   JSON.parse chỉ thẳng ra vị trí hỏng, nên bỏ đúng ký tự đó rồi parse lại —
   đủ cứu file bị lẫn vài ký tự lạ lúc tải về hoặc lúc ghi đè. Giới hạn 5 lần
   để không "sửa" bừa thành dữ liệu sai, và phải qua được kiểm tra hình dạng
   (có duAns, mỗi dự án có items) mới coi là cứu được.
   Trả null nếu không cứu nổi — tuyệt đối không đoán nội dung thiếu. */
function suaJson(txt) {
  const MAX = 5;
  const xoa = [];
  let s = txt;
  for (let i = 0; i <= MAX; i++) {
    let j = null;
    try { j = JSON.parse(s); } catch (err) {
      const m = /position (\d+)/.exec(err.message);
      if (!m || i === MAX) return null;
      const p = +m[1];
      if (p >= s.length) return null;          // cụt đuôi, không phải ký tự thừa
      xoa.push({ viTri: p, kyTu: s[p] });
      s = s.slice(0, p) + s.slice(p + 1);
      continue;
    }
    if (!xoa.length) return { j, xoa };
    const ok = j && Array.isArray(j.duAns) && j.duAns.length
            && j.duAns.every((d) => Array.isArray(d.items));
    return ok ? { j, xoa } : null;
  }
  return null;
}

/* Mở .json — báo cho ra đầu ra đũa khi file hỏng. "File không hợp lệ" trống không
   không đủ để biết file bị làm sao, nên ở đây nhận diện luôn mấy kiểu hay gặp
   (chọn nhầm .xlsx, file HTML, file rỗng, BOM) và trích đoạn chữ quanh chỗ hỏng. */
$('#fileJson').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();

  rd.onerror = () => toast(`Không đọc được "${f.name}": ${rd.error?.message || 'lỗi không rõ'}`, 6000);

  rd.onload = () => {
    /* Bỏ BOM và khoảng trắng thừa — file đi qua Notepad hay một số dịch vụ
       chuyển file hay bị chèn thêm, JSON.parse thì không chịu. */
    const txt = String(rd.result || '').replace(/^\uFEFF/, '').trim();
    const dau = txt.slice(0, 80);

    const la = !txt                ? 'file rỗng, không có nội dung'
             : txt.startsWith('PK') ? 'đây là file nén hoặc .xlsx, không phải .json'
             : txt[0] === '<'       ? 'đây là file HTML hoặc XML, không phải .json'
             : !/^[{[]/.test(txt)   ? `nội dung không bắt đầu bằng { hoặc [ — bắt đầu bằng: ${dau.slice(0, 30)}`
             : null;
    if (la) {
      console.error('Mở .json thất bại:', la, '\n80 ký tự đầu:', dau);
      return toast(`Không mở được "${f.name}": ${la}`, 9000);
    }

    let j, daSua = null;
    try {
      j = JSON.parse(txt);
    } catch (err) {
      const vt = +(/position (\d+)/.exec(err.message)?.[1] ?? -1);
      const quanh = vt >= 0 ? txt.slice(Math.max(0, vt - 30), vt + 30).replace(/\s+/g, ' ') : dau;
      console.error('Mở .json thất bại:', err, '\nQuanh chỗ hỏng:', quanh);

      /* Hỏng nhẹ thì cứu được nguyên vẹn — nhưng hỏi người dùng trước,
         không bao giờ tự ý nạp dữ liệu đã bị sửa. */
      const cuu = suaJson(txt);
      if (!cuu) return toast(`Không mở được "${f.name}": ${err.message}. Chỗ hỏng: …${quanh}…`, 12000);

      const soDA = cuu.j.duAns.length;
      const soHM = cuu.j.duAns.reduce((a, d) => a + d.items.length, 0);
      const ky = cuu.xoa.map((x) => `"${x.kyTu}" ở vị trí ${x.viTri}`).join(', ');
      const hoi = (m) => { try { return confirm(m); } catch (e) { return true; } };
      if (!hoi(`File "${f.name}" lẫn ${cuu.xoa.length} ký tự lạ: ${ky}.\n\n`
             + `Bỏ mấy ký tự đó ra thì đọc được đầy đủ: ${soDA} dự án, ${soHM} hạng mục.\n\n`
             + `Mở bản đã sửa?`)) return toast('Đã huỷ, không mở file.', 4000);
      j = cuu.j;
      daSua = cuu.xoa;
      console.warn('Đã cứu file .json:', cuu.xoa);
    }

    /* File "Gửi sang Chi phí TK" của app TMB Quy hoạch (bản web): chỉ thêm / cập nhật
       đúng một dự án — không thay cả kho như mở file .json lưu đủ. */
    if (j && j.loai === 'tmb-sang-cptk' && j.duAn) {
      try {
        const d = chuanHoa({ duAns: [JSON.parse(JSON.stringify(j.duAn))] }).duAns[0];
        /* tính thử từng hạng mục TRƯỚC khi ghi vào kho — một hạng mục lỗi không được làm hỏng cả kho */
        const hong = [];
        for (const it of d.items) { try { tinhHangMuc(it, kho.donGia, d); } catch (e) { hong.push(`${it.ten}: ${e.message}`); } }
        if (hong.length) {
          console.error('Hạng mục TMB không tính được:', hong);
          return toast(`Chưa nhận file TMB — ${hong.length} hạng mục không tính được (${hong[0]}${hong.length > 1 ? '…' : ''}). Kho chưa bị thay đổi.`, 12000);
        }
        let da = kho.duAns.find((x) => x.nguonTMB && x.nguonTMB === j.duAn.nguonTMB);
        const moi = !da;
        if (moi) { da = Object.assign({}, d, { id: moiId() }); kho.duAns.push(da); }
        else { da.items = d.items; da.diaDiem = d.diaDiem || da.diaDiem; }
        luu();
        moDuAn(da.id);
        toast(`${moi ? 'Đã thêm' : 'Đã cập nhật'} dự án "${da.ten}" — ${da.items.length} hạng mục từ TMB Quy hoạch. Các dự án khác giữ nguyên.`, 6000);
      } catch (err) {
        console.error('Nhận file TMB thất bại:', err);
        toast(`Đọc được "${f.name}" nhưng không nhận được hạng mục từ TMB: ${err.message}`, 9000);
      }
      return;
    }

    try {
      kho = chuanHoa(j.duAns ? j : { donGia: j.donGia, duAns: [{ ten: j.ten, items: j.items }] });
      moDuAn(kho.duAns[0].id);
      toast(daSua
        ? `Đã sửa và mở "${f.name}" — bỏ ${daSua.length} ký tự lạ. Bấm Lưu .json để có bản sạch.`
        : 'Đã mở ' + f.name, daSua ? 12000 : 2200);
      canhBaoPhienBan(kho, f.name);
    } catch (err) {
      console.error('Dựng lại dữ liệu thất bại:', err);
      toast(`Đọc được "${f.name}" nhưng dựng lại dữ liệu lỗi: ${err.message}`, 9000);
    }
  };

  rd.readAsText(f);
  e.target.value = '';
};
