<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính chi phí thiết kế dự án</title>
<style>
/* =============================================================================
   Bảng màu: nền pastel nhạt, chữ đậm thống nhất #002060, chữ phụ xám nhạt.
   Toàn bộ chữ dùng Arial.
   Ô nhập tay và ô tự tính phân biệt bằng NỀN (trắng / xám nhạt) chứ không
   bằng màu chữ, để mọi chữ đậm đều là #002060.
   ========================================================================== */
:root{
  --bg:#f4f7fc; --panel:#fff; --panel-2:#fafcff;
  --ink:#002060;            /* mọi chữ đậm */
  --muted:#8792a6;          /* chữ phụ, nhãn */
  --muted-2:#aab3c2;        /* chữ mờ nhất */
  --line:#e4eaf4; --line-2:#eef2f8;
  --soft:#eaf1fb;           /* pastel xanh */
  --soft-2:#f2f6fd;
  --sel:#e3ecfa;
  --ro-bg:#f3f6fb;          /* nền ô tự tính */
  --ok:#1f7a5e; --bad:#b3402f; --warn:#a86a12;
  --r:9px;

  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:19px;
  --ff:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;font-family:var(--ff)}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font:var(--fs-md)/1.5 var(--ff);
  display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
}

/* ---------- thanh trên ---------- */
header{
  background:var(--panel); padding:9px 14px; display:flex; gap:8px; align-items:center;
  flex-wrap:wrap; border-bottom:1px solid var(--line); box-shadow:0 1px 3px rgba(0,32,96,.06); z-index:6;
}
header h1{font-size:var(--fs-lg);margin:0;font-weight:700;letter-spacing:.6px;color:var(--ink);white-space:nowrap}
.spacer{flex:1}

.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:7px;
  padding:5px 12px; cursor:pointer; font:var(--fs-md) var(--ff); white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--soft-2);border-color:#cfdcef}
.btn.g{background:var(--ink);color:#fff;border-color:transparent;font-weight:600}
.btn.g:hover{background:#0a2f7a}
.btn.sm{padding:3px 9px;font-size:var(--fs-sm)}
.btn.ico{padding:4px 9px;font-size:var(--fs-lg);line-height:1;color:var(--muted)}
.btn.ico:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default;background:var(--panel)}

/* ---------- bố cục 3 cột ---------- */
main{flex:1;display:flex;min-height:0}
#rail{
  width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow:auto;padding:9px;
}
#left{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#right{
  width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:12px 14px 40px;
}
body.rail-gon #rail{display:none}
body.rail-gon #right{width:470px}

/* ---------- danh sách dự án ---------- */
.da{
  padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:4px;
  border:1px solid transparent;border-left:3px solid transparent;
}
.da:hover{background:var(--soft-2)}
.da.sel{background:var(--soft);border-left-color:var(--ink)}
.da-ten{font-weight:700;font-size:var(--fs-md);color:var(--ink);line-height:1.3}
.da-noi{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.da-so{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;gap:6px}
.da-so b{font-size:var(--fs-md);color:var(--ink);font-variant-numeric:tabular-nums}
.da-so span{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.rail-hr{height:1px;background:var(--line);margin:7px 2px}
.rail-add{width:100%;margin-top:8px}

/* ---------- thanh dự án ---------- */
.da-bar{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);
}
.da-ten-in{
  border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font:700 var(--fs-lg) var(--ff);color:var(--ink);min-width:250px;background:var(--panel);
}
.da-ten-in:focus{outline:2px solid var(--soft);border-color:#a9c4e8}
.da-lb{font-size:var(--fs-sm);color:var(--muted)}
.da-hint{font-size:var(--fs-xs);color:var(--muted)}
.th-title{color:var(--ink);font-size:var(--fs-lg);letter-spacing:.4px;font-weight:700}
.sep{width:1px;height:20px;background:var(--line)}
.toolbar{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);
}

/* ---------- bảng ---------- */
.tbl-wrap{flex:1;min-height:0;overflow:auto;padding:0 14px 40px}
/* Bề rộng cột khai báo bằng % trong colgroup nên dùng table-layout:fixed:
   phần dư chia theo đúng tỷ lệ thay vì dồn hết vào cột "Hạng mục". */
table.grid{
  width:100%;min-width:1260px;table-layout:fixed;border-collapse:separate;border-spacing:0;
  background:var(--panel);font-size:var(--fs-md);
}
/* Tiêu đề cột luôn căn giữa, cùng cỡ chữ với nội dung, được phép xuống dòng */
table.grid th{
  background:var(--soft);color:var(--ink);font-weight:700;text-align:center;
  padding:7px 9px;border-bottom:1px solid #cfdcef;position:sticky;top:0;z-index:2;
  font-size:var(--fs-md);letter-spacing:.2px;white-space:normal;line-height:1.25;
}
table.grid td{padding:5px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.grid tr.grp td{background:var(--soft-2);font-weight:700;color:var(--ink)}
table.grid tr.item{cursor:pointer}
table.grid tr.item:hover td{background:var(--soft-2)}
table.grid tr.item.sel td{background:var(--sel)}
table.grid tr.tot td{
  background:var(--soft);font-weight:700;color:var(--ink);
  border-top:2px solid var(--ink);border-bottom:0;
}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td.c{white-space:nowrap}   /* giá trị ngắn — không cho bẻ dòng làm lệch chiều cao hàng */
.nm:hover{text-decoration:underline}
.tag{
  display:inline-block;max-width:100%;padding:1px 7px;border-radius:11px;
  background:var(--soft);color:#5a6b86;font-size:var(--fs-xs);line-height:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
.tag.big{background:var(--ink);color:#fff;font-size:var(--fs-sm);line-height:21px;padding:0 11px;font-weight:600}
.z{color:var(--muted-2)}

/* ---------- khoản chi phí đã tắt ----------
   Tắt chỉ là không cộng vào tổng và không ra Excel — số vẫn tính ra,
   nên ô vẫn hiện số gốc, chỉ gạch ngang và mờ đi. */
.tag.off{background:#fdf1dc;color:var(--warn);font-weight:700}
table.grid td.kh{cursor:pointer}
table.grid tr.item:hover td.kh{box-shadow:inset 0 -1px 0 var(--muted-2)}
table.grid td.kh.tat{color:var(--muted-2);text-decoration:line-through;background:#fdf8ef}
table.grid tr.item:hover td.kh.tat{background:#fbf1de}

.phu{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap}
.rong{padding:28px 0;text-align:center;color:var(--muted)}

/* ---------- thẻ panel ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px}
.card>h3{
  margin:0;padding:9px 13px;font-size:var(--fs-xs);letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line-2);font-weight:700;
}
.card .body{padding:11px 13px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.kpi:last-child{border:0}
.kpi b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--ink)}
.kpi .lb{color:var(--muted);font-size:var(--fs-sm)}
.big{font-size:var(--fs-xl) !important}
table.mini{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.mini th{text-align:left;color:var(--muted);font-weight:600;font-size:var(--fs-xs);padding:4px;border-bottom:1px solid var(--line)}
table.mini td{padding:4px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums;color:var(--ink)}
table.mini td.n,table.mini th.n{text-align:right}

/* ---------- form ---------- */
.f{display:grid;grid-template-columns:1fr 1fr;gap:9px 11px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld input,.fld select{
  border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:var(--fs-md) var(--ff);
  color:var(--ink);background:var(--panel);width:100%;
}
.fld input:focus,.fld select:focus{outline:2px solid var(--soft);border-color:#a9c4e8}
.fld input.ro{background:var(--ro-bg);border-color:var(--line-2);font-weight:600}
.fld .hint{font-size:var(--fs-xs);color:var(--muted)}
.cbx{display:flex;gap:7px;align-items:center;color:var(--ink);font-size:var(--fs-sm);cursor:pointer;padding:2px 0}
.cbx input{width:auto;accent-color:var(--ink)}
.src{
  margin-top:8px;padding:6px 9px;background:var(--soft-2);border-left:3px solid #b9cdea;
  border-radius:0 5px 5px 0;font-size:var(--fs-xs);color:#5a6b86;line-height:1.5;
}
.src b{color:var(--ink)}
fieldset{
  border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0 0 11px;
  min-inline-size:0;min-width:0;background:var(--panel);
}
legend{font-size:var(--fs-xs);color:var(--muted);font-weight:700;padding:0 5px;text-transform:uppercase;letter-spacing:.6px}

/* ---------- diễn giải ---------- */
table.dg{width:100%;border-collapse:collapse;font-size:var(--fs-sm);table-layout:fixed}
table.dg td{padding:4px;border-bottom:1px solid var(--line-2);vertical-align:top;overflow-wrap:anywhere}
table.dg td:first-child{color:var(--muted);width:30%}
table.dg td:nth-child(2){color:#5a6b86;font-size:var(--fs-xs)}
table.dg td:last-child{
  text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;
  width:36%;white-space:nowrap;overflow-wrap:normal;
}
table.dg tr.dg-tot td{
  padding-top:7px;border-bottom:0;font-weight:700;color:var(--ink);font-size:var(--fs-sm);
}
table.dg tr.dg-tot:first-of-type td{border-top:1px solid var(--line)}

/* ---------- linh tinh ---------- */
.note{font-size:var(--fs-sm);color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 16px 50px rgba(0,32,96,.22);max-width:min(94vw,800px);width:100%}
dialog::backdrop{background:rgba(0,32,96,.32)}
dialog .dh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);font-size:var(--fs-lg)}
dialog .db{padding:15px;max-height:70vh;overflow:auto}
dialog .df{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:22px;font-size:var(--fs-sm);opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 6px 20px rgba(0,32,96,.28);
}
#toast.on{opacity:1}

/* ---------- màn hình hẹp ---------- */
@media (max-width:1400px){
  #rail{width:180px}
  #right{width:360px}
  body.rail-gon #right{width:430px}
}
@media (max-width:1160px){
  main{flex-wrap:wrap}
  #rail,body.rail-gon #rail{
    display:flex;width:100%;max-height:126px;border-right:0;border-bottom:1px solid var(--line);
    gap:7px;overflow-x:auto;align-items:flex-start;
  }
  .da{flex:0 0 194px;border-left-width:3px}
  .rail-hr{width:1px;height:auto;align-self:stretch;margin:2px 4px}
  .rail-add{width:auto;flex:none;margin-top:0;align-self:center}
  #left{flex:1 1 100%;min-height:340px}
  #right,body.rail-gon #right{
    width:100%;flex:0 0 auto;max-height:44vh;border-left:0;border-top:2px solid var(--line);
  }
  #right>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:0 12px;align-items:start}
  #btnRail{display:none}
}

/* =============================================================================
   BÁO CÁO — trang A4 in được, phủ lên toàn bộ giao diện
   ========================================================================== */
#baocao{
  position:fixed; inset:0; z-index:200; background:#eceff4; overflow:auto;
  display:flex; flex-direction:column; align-items:center;
}
#baocao[hidden]{display:none}
.bc-thanh{
  position:sticky; top:0; z-index:2; width:100%; display:flex; gap:8px; align-items:center;
  padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,32,96,.08);
}
.bc-giay{
  width:210mm; min-height:297mm; background:#fff; margin:18px 0 40px; padding:16mm 14mm;
  box-shadow:0 2px 18px rgba(0,32,96,.14); color:var(--ink);
  font:11px/1.5 var(--ff); font-variant-numeric:tabular-nums;
}
.bc-dau{border-bottom:2px solid var(--ink); padding-bottom:9px; margin-bottom:14px}
.bc-nho{font-size:10px; letter-spacing:1.4px; color:var(--muted); text-transform:uppercase}
.bc-giay h1{font-size:21px; margin:4px 0 2px; letter-spacing:.3px}
.bc-noi{font-size:12px; color:#5a6b86}
.bc-canhCu{width:100%; border-collapse:collapse; margin-top:9px; font-size:9.5px; color:#5a6b86}
.bc-canhCu td{border:1px solid var(--line); padding:4px 7px; vertical-align:top; width:25%}
.bc-canhCu b{color:var(--ink); font-size:10px}

.bc-muc{margin-bottom:16px}
.bc-muc h2{font-size:13px; margin:0 0 7px; padding-bottom:3px; border-bottom:1px solid var(--line)}
.bc-ngat{break-before:page}

.bc-kv{width:100%; border-collapse:collapse}
.bc-kv td{padding:4px 7px; border-bottom:1px solid var(--line-2)}
.bc-kv td.n{text-align:right; white-space:nowrap; width:38%}
.bc-kv tr.dam td{background:var(--soft); font-size:12px}

table.bc-bang{width:100%; border-collapse:collapse; margin-bottom:8px}
table.bc-bang th{background:var(--soft); text-align:left; font-weight:700; padding:4px 6px;
  border:1px solid #cfdcef; font-size:10px; line-height:1.25}
table.bc-bang td{padding:3px 6px; border:1px solid var(--line); vertical-align:top}
table.bc-bang td.n,table.bc-bang th.n{text-align:right; white-space:nowrap}
table.bc-bang td.c,table.bc-bang th.c{text-align:center}
table.bc-bang tr.grp td{background:var(--soft-2); font-weight:700}
table.bc-bang tfoot td{background:var(--soft); font-weight:700; border-top:2px solid var(--ink)}
table.bc-bang.nho{font-size:10px; max-width:118mm}
table.bc-bang i{display:inline-block; width:8px; height:8px; border-radius:2px; vertical-align:middle}
.bc-nguon{font-size:9px; color:#5a6b86; line-height:1.35}
.bc-phu{font-size:9px; color:var(--muted)}
.bc-ghi{font-size:9.5px; color:#5a6b86; line-height:1.55; margin:4px 0 0}
.bc-ghi b{color:var(--ink)}
.bc-ul{font-size:10px; margin:0; padding-left:16px; line-height:1.7}
.bc-chan{margin-top:14px; padding-top:7px; border-top:1px solid var(--line);
  font-size:9px; color:var(--muted); text-align:center}

@media print{
  @page{size:A4; margin:12mm}
  body>*{display:none !important}
  body.dang-baocao #baocao{display:block !important; position:static; background:#fff; overflow:visible}
  .bc-thanh{display:none !important}
  .bc-giay{width:auto; min-height:0; margin:0; padding:0; box-shadow:none}
  table.bc-bang{break-inside:auto}
  table.bc-bang tr{break-inside:avoid}
  table.bc-bang thead{display:table-header-group}
  .bc-muc{break-inside:avoid-page}
}
/* Bảng chi tiết nhiều cột — thu lại cho vừa khổ giấy A4 */
table.bc-bang.bc-ct{font-size:9px}
table.bc-bang.bc-ct th,table.bc-bang.bc-ct td{padding:2px 4px}
table.bc-bang.bc-ct .bc-phu{font-size:8px}

</style>
</head>
<body>

<header>
  <button class="btn ico" id="btnRail" title="Thu gọn / mở danh sách dự án">◧</button>
  <h1>CHI PHÍ THIẾT KẾ</h1>
  <span class="spacer"></span>
  <button class="btn" id="btnDonGia">Đơn giá &amp; tham số</button>
  <button class="btn" id="btnJsonIn">Mở .json</button>
  <button class="btn" id="btnJsonOut">Lưu .json</button>
  <button class="btn" id="btnBaoCao">Báo cáo</button>
  <button class="btn g" id="btnExcel">Xuất Excel</button>
  <input type="file" id="fileJson" accept=".json,.txt,application/json,text/plain" hidden>
</header>

<main>
  <nav id="rail"></nav>
  <div id="left"></div>
  <div id="right"><div id="panel"></div></div>
</main>

<dialog id="dlg">
  <div class="dh" id="dlgTitle"></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button class="btn" id="dlgClose">Đóng</button></div>
</dialog>

<div id="toast"></div>

<script>
/* Bản đăng artifact: lưu file qua capability downloads */
window.__dl = null;
(async()=>{ try{ window.__dl = await window.claude?.use?.("downloads"); }catch(e){} })();
</script>
<script>
/* =============================================================================
   tables.js — Dữ liệu tra bảng
     · TT 38/2026/TT-BXD (PL VIII) — Định mức chi phí QLDA và tư vấn xây dựng
     · QĐ 425/QĐ-BXD (30/3/2026)  — Suất vốn đầu tư xây dựng năm 2025
   Số liệu gõ theo đúng bản PDF; xem test/dotable.py để đối chiếu ngược.
   ========================================================================== */
'use strict';

/* ============================ TT 38/2026 ================================= */

/* Bảng 2.3 — Định mức lập báo cáo nghiên cứu khả thi (BCNCKT)
   Khoá tra: chi phí xây dựng + thiết bị, chưa VAT (tỷ đồng) */
const B2_3_KEY = [15, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 30000];
const B2_3 = {
  danDung:    [1.114, 0.914, 0.751, 0.534, 0.402, 0.287, 0.246, 0.209, 0.167, 0.134, 0.102, 0.086],
  congNghiep: [1.261, 1.112, 0.882, 0.654, 0.515, 0.466, 0.404, 0.315, 0.248, 0.189, 0.135, 0.107],
  giaoThong:  [0.689, 0.628, 0.501, 0.393, 0.271, 0.203, 0.177, 0.151, 0.120, 0.097, 0.075, 0.063],
  nongNghiep: [0.943, 0.858, 0.685, 0.480, 0.361, 0.273, 0.234, 0.201, 0.161, 0.129, 0.100, 0.084],
  haTang:     [0.719, 0.654, 0.524, 0.407, 0.280, 0.211, 0.185, 0.158, 0.127, 0.101, 0.078, 0.065],
};

/* Bảng 2.4 — Định mức lập báo cáo kinh tế - kỹ thuật (BCKTKT)
   Chỉ áp dụng khi tổng mức đầu tư ≤ 40 tỷ */
const B2_4_KEY = [1, 3, 7, 15, 20, 40];
const B2_4 = {
  danDung:    [6.5, 4.7, 4.2, 3.6, 2.9, 2.4],
  congNghiep: [6.7, 4.8, 4.3, 3.8, 3.2, 2.5],
  giaoThong:  [5.4, 3.6, 3.0, 2.9, 2.7, 2.1],
  nongNghiep: [6.2, 4.4, 3.9, 3.6, 3.1, 2.4],
  haTang:     [5.8, 4.2, 3.4, 3.0, 2.8, 2.2],
};

                  'Hậu Giang', 'Kiên Giang', 'Sóc Trăng', 'Bạc Liêu', 'Cà Mau', 'Thành phố Cần Thơ'] },
  { so: 7, tinh: ['Thành phố Hà Nội'] },
  { so: 8, tinh: ['Thành phố Hồ Chí Minh'] },
];

/** Bảng 100 — hệ số theo loại công trình × vùng 1..8 */
const QD409_B100 = {
  nhaO:      { ten: 'Công trình nhà ở',                          hs: [0.935, 0.948, 1.032, 1.048, 1.048, 1.017, 0.952, 1.064] },
  giaoDuc:   { ten: 'Công trình giáo dục, đào tạo, nghiên cứu',   hs: [0.940, 0.930, 1.023, 1.071, 1.042, 1.039, 0.959, 1.037] },
  yTe:       { ten: 'Công trình y tế',                            hs: [0.994, 0.957, 1.012, 1.029, 1.029, 1.001, 0.960, 1.030] },
  theThao:   { ten: 'Công trình thể thao',                        hs: [0.936, 0.931, 1.003, 1.029, 1.034, 1.010, 0.942, 1.039] },
  vanHoa:    { ten: 'Công trình văn hóa',                         hs: [0.944, 0.948, 1.026, 1.042, 1.050, 1.018, 0.978, 1.032] },
  daNang:    { ten: 'Công trình đa năng; Trụ sở, văn phòng làm việc', hs: [0.949, 0.938, 1.016, 1.063, 1.062, 1.009, 0.970, 1.052] },
  dichVu:    { ten: 'Công trình dịch vụ (khách sạn)',             hs: [0.952, 0.944, 1.027, 1.069, 1.036, 1.016, 0.959, 1.032] },
  htktDoThi: { ten: 'Công trình hạ tầng kỹ thuật khu công nghiệp, khu đô thị, cụm công nghiệp',
                                                                  hs: [0.902, 0.907, 0.989, 1.103, 1.060, 1.074, 0.940, 1.089] },
};

/** Danh sách địa điểm phẳng, đã sắp xếp — dùng cho ô chọn trong giao diện */
const QD409_DIA_DIEM = QD409_VUNG
  .flatMap((v) => v.tinh.map((t) => ({ ten: t, vung: v.so })))
  .sort((a, b) => a.ten.localeCompare(b.ten, 'vi'));

/** @return số vùng 1..8, hoặc 0 nếu không tra được */
function traVung(diaDiem) {
  const d = QD409_DIA_DIEM.find((x) => x.ten === diaDiem);
  return d ? d.vung : 0;
}

/** @return { f, vung, nguon } — hệ số điều chỉnh vùng cho suất vốn đầu tư */
function traHeSoVung(diaDiem, nhomVung) {
  const vung = traVung(diaDiem);
  const nhom = QD409_B100[nhomVung] || QD409_B100.nhaO;
  if (!vung) return { f: 1, vung: 0, nguon: 'chưa chọn địa điểm — tạm lấy hệ số 1,0' };
  return {
    f: nhom.hs[vung - 1], vung,
    nguon: `QĐ 409/QĐ-BXD · Bảng 100 · Vùng ${vung} (${diaDiem}) · ${nhom.ten}`,
  };
}

/* ---------------------- Nội suy tuyến tính, kẹp ở hai biên ---------------- */
function noiSuy(keys, vals, x) {
  const p = [];
  for (let i = 0; i < keys.length; i++) if (vals[i] != null) p.push([keys[i], vals[i]]);
  if (!p.length) return 0;
  if (x <= p[0][0]) return p[0][1];
  if (x >= p[p.length - 1][0]) return p[p.length - 1][1];
  for (let i = 0; i < p.length - 1; i++) {
    const [k0, v0] = p[i], [k1, v1] = p[i + 1];
    if (x >= k0 && x <= k1) return v0 + (x - k0) / (k1 - k0) * (v1 - v0);
  }
  return p[p.length - 1][1];
}

/* -------------------- Tra định mức TT 38 --------------------------------- */
/**
 * @param L      giá trị áp dụng điều chỉnh định mức (tỷ đồng, chưa VAT)
 * @param nhom   'danDung' | 'congNghiep' | 'haTang' | 'giaoThong' | 'nongNghiep'
 * @param cap    'DB'|'I'|'II'|'III'|'IV'
 * @param buocTK 2 hoặc 3
 */
function traDinhMuc(L, nhom, cap, buocTK) {
  const duoiNguong = L < NGUONG_BCKTKT;
  const hangB = B2_3[nhom] ? nhom : 'danDung';
  const tkcs = duoiNguong
    ? { ty: noiSuy(B2_4_KEY, B2_4[hangB], L) / 100, bang: '2.4', ghi: 'Lập BCKTKT (< 40 tỷ)' }
    : { ty: noiSuy(B2_3_KEY, B2_3[hangB], L) / 100, bang: '2.3', ghi: 'Lập BCNCKT' };

  const bo = BANG_TK[nhom] || BANG_TK.danDung;
  const c = bo.tkbvtc[cap] ? cap : 'I';
  let tkkt = { ty: 0, bang: null, ghi: '' }, tkbvtc;
  if (buocTK === 3) {
    const dm = noiSuy(TK_KEY, bo.tkkt[c], L) / 100;
    tkkt   = { ty: dm, bang: bo.maKT, ghi: `TKKT — ${CAP_TEN[c]}` };
    tkbvtc = { ty: dm * HE_SO_TKBVTC_3BUOC, bang: bo.maKT,
               ghi: `TKBVTC = 55% định mức bảng ${bo.maKT}` };
  } else {
    tkbvtc = { ty: noiSuy(TK_KEY, bo.tkbvtc[c], L) / 100, bang: bo.maTC,
               ghi: `TKBVTC — ${CAP_TEN[c]}` };
  }
  return { tkcs, tkkt, tkbvtc, nhomTen: bo.ten, cap: c };
}

/* -------------------- Tra suất vốn đầu tư QĐ 425 ------------------------- */
/** Trả về { g, h, nguon } — đơn vị đồng/m² sàn. */
function traSuatVon(bangId, o) {
  /* v = [chi phí xây dựng, chi phí thiết bị, suất vốn đầu tư] — nghìn đồng / đơn vị.
     sv = suất vốn đầu tư, phần tử thứ ba; QĐ 425 chỉ công bố nó ở các bảng tính theo
     m² sàn / ha của TOÀN công trình. Bảng khối chức năng (4, 6, 8, 16) không có cột
     này nên sv = 0 → app để người dùng tự khai. */
  const nghin = (v, nguon) => ({ g: (v[0] || 0) * 1000, h: (v[1] || 0) * 1000, sv: (v[2] || 0) * 1000, nguon });

  if (bangId === 'chungCu' || bangId === 'daNang' || bangId === 'vanPhong') {
    const B = { chungCu: QD_CHUNG_CU, daNang: QD_DA_NANG, vanPhong: QD_VAN_PHONG }[bangId];
    const tang = Math.max(1, +o.soTang || 1);
    const bac = B.bac.find((b) => tang <= b.max) || B.bac[B.bac.length - 1];
    const ham = Math.min(Math.max(0, Math.round(+o.soHam || 0)), bac.v.length - 1);
    return nghin(bac.v[ham], `${B.ten} · ${bac.ten} · ${ham ? 'có ' + ham + ' tầng hầm' : 'không có tầng hầm'}`);
  }

  if (bangId === 'nhaRiengLe') {
    const k = QD_NHA_RIENG_LE.kieu.find((x) => x.ma === o.kieuNha) || QD_NHA_RIENG_LE.kieu[0];
    const ham = Math.min(Math.max(0, Math.round(+o.soHam || 0)), 1);
    if (k.theoDT) {
      const dt = k.dt.find((d) => (+o.dtXD || 0) < d.max) || k.dt[k.dt.length - 1];
      return nghin(dt.v[Math.min(ham, dt.v.length - 1)],
        `${QD_NHA_RIENG_LE.ten} · ${k.ten} · ${dt.ten}${ham ? ' · 1 hầm' : ''}`);
    }
    return nghin(k.ham[Math.min(ham, k.ham.length - 1)],
      `${QD_NHA_RIENG_LE.ten} · ${k.ten}${ham && k.ham.length > 1 ? ' · 1 hầm' : ''}`);
  }

  if (QD_KHOI[bangId]) {
    const B = QD_KHOI[bangId];
    const k = B.khoi.find((x) => x.id === (o.khoiCN || 'hocTap')) || B.khoi[0];
    const ra = nghin(k.v, `${B.ten} · ${k.ten}`);
    /* Trường học: suất vốn đầu tư công bố theo đầu cháu / học sinh, không theo m² sàn. */
    const H = QD_TRUONG_HS[bangId];
    if (H && !ra.sv) {
      const n = +o.soHS || 0;
      const bac = H.bac.find((x) => n <= x.max) || H.bac[H.bac.length - 1];
      ra.svDv = H.dv;
      ra.svHS = bac.sv * 1000;
      ra.nguonSvHS = `${H.ten} · ${bac.ten}`;
    }
    return ra;
  }

  if (bangId === 'htkt') {
    const ha = +o.dienTichHa > 0 ? +o.dienTichHa : (+o.d || 0) / 10000;
    const bac = QD_HTKT.bac.find((b) => ha <= b.max) || QD_HTKT.bac[QD_HTKT.bac.length - 1];
    return nghin(bac.v, `${QD_HTKT.ten} · ${bac.ten} (${ha.toFixed(1)} ha)`);
  }

  return { g: 0, h: 0, nguon: 'không có bảng tra — nhập tay' };
}

   'tay' (chỉ concept): dùng số concept / tòa nhập tay ở từng hạng mục.          */

/** mức giá của hạng mục: thap | giua | cao | tay */
function mucCua(it, dg) {
  if (it && (MUC_GIA[it.mucGia] || it.mucGia === 'tay')) return it.mucGia;
  return MUC_GIA[dg && dg.mucMacDinh] ? dg.mucMacDinh : 'giua';

  if (/noxh|xa hoi|tai dinh cu|\btdc|tđc/.test(t)) return 'thap';
  if (/diem nhan|landmark|bieu tuong/.test(t)) return 'cao';
  return 'giua';
}

   Tái lập chuỗi viết tay trong cột U/V của file gốc:
     (O + O×0,2×a + O×50% + O×50%×0,2×b) × S
   với a = số tòa điển hình lặp lại, b = số tòa biến thể lặp lại.
   Kiểm chứng: r4 (4 tòa/1 bt)→1,9 · r6 (6/2)→2,2 · r8 (4/0)→1,6 · r5 (2/0)→1,2
--------------------------------------------------------------------------- */
function heSoNhanBan(nToa, nBienThe, kLap, kBienThe) {
  nToa = Math.max(0, nToa | 0);
  nBienThe = Math.min(Math.max(0, nBienThe | 0), nToa);
  const nDienHinh = nToa - nBienThe;
  return (nDienHinh > 0 ? 1 : 0)
       + kLap * Math.max(0, nDienHinh - 1)
       + (nBienThe > 0 ? kBienThe : 0)
       + kBienThe * kLap * Math.max(0, nBienThe - 1);
}

/* Concept chỉ tính 1 mẫu điển hình + 1 mẫu biến thể, không nhân theo số tòa.
   (r4 có 1 biến thể → 1,5 ; r6 có 2 biến thể → vẫn 1,5) */
function heSoConcept(nToa, nBienThe, kBienThe) {
  return (nToa > 0 ? 1 : 0) + (nBienThe > 0 ? kBienThe : 0);
}

const ru = (x) => (isFinite(x) && x > 0 ? Math.ceil(x - 1e-9) : 0);   // ROUNDUP(x,0)

/* ---------- Bộ máy tính cho 1 hạng mục ------------------------------------
   duAn cung cấp ngữ cảnh cấp dự án — hiện chỉ có địa điểm xây dựng, dùng để
   tra hệ số điều chỉnh vùng. Nhóm công trình trong Bảng 100 suy ra từ loại
   hạng mục, không phải khai báo lại từng dòng.
--------------------------------------------------------------------------- */
/* ---------- bật / tắt từng khoản chi phí của RIÊNG một hạng mục ------------
   Người dùng chọn hạng mục nào tính khoản nào. Khoản bị tắt thì tiền = 0,
   nhân công = 0, định biên = 0 — không vào tổng, không ra file Excel.
   Giá trị gốc vẫn tính đủ và giữ ở r.goc để còn xem "bật lại thì là bao nhiêu".
   Cờ nằm ở it.tat = { T:true, V:true, ... } — không có cờ nghĩa là đang bật. */
const KHOAN = ['T', 'U', 'UKT', 'V', 'W'];
const TEN_KHOAN = { T: 'Concept', U: 'TKCS', UKT: 'TKKT', V: 'TKBVTC', W: 'HSBH' };

/** Các khoản một hạng mục có thể có, theo cách tính của nó */
function khoanCua(mode, buocTK, it) {
  if (mode === 'khac') return [giaiDoanKhac(it)];   // tiền chỉ nằm ở đúng một giai đoạn
  if (mode === 'suat') return buocTK === 3 ? ['T', 'U', 'UKT', 'V', 'W'] : ['T', 'U', 'V', 'W'];
  if (mode === 'thapTang') return ['T', 'U', 'V', 'W'];
  return ['T', 'V', 'W'];
}

/** Giai đoạn mà tiền của hạng mục loại 'Khác' rơi vào — mặc định TKBVTC */
const GIAI_DOAN_KHAC = ['T', 'U', 'V', 'W'];
const giaiDoanKhac = (it) =>
  GIAI_DOAN_KHAC.includes(it && it.gdKhac) ? it.gdKhac : 'V';

function tinhHangMuc(it, dg, duAn) {
  const L = LOAI[it.loai] || LOAI.caoTang;
  const mode = L.mode;
  const r = {
    loai: it.loai, mode, nhom: L.nhom,
    I: 0, J: 0, K: 0, Lty: 0, O: 0, P: 0, PKT: 0, hsNhanBan: 0, hsConcept: 0,
    f: 0, vung: 0, g: 0, h: 0, sv: 0, svDv: 'm² sàn', svQuyMo: 0, svTong: 0, nguonSv: null, m: 0, n: 0, nkt: 0,
    nguonVung: null, nguonSV: null, nguonDM: null,
    cap: '', buocTK: 2, y: 0, s: 0,
    thangC: 0, thangCS: 0, thangKT: 0, thangTC: 0,
    T: 0, U: 0, UKT: 0, V: 0, W: 0, X: 0,
    Z: 0, AA: 0, AAKT: 0, AB: 0,
    AF: 0, AG: 0, AGKT: 0, AH: 0, AI: 0,
    dienGiai: [],
  };

  const d  = +it.d || 0;
  const y  = it.y != null ? +it.y : dg.tyLeNhanCong;
  const s  = it.s != null ? +it.s : (L.s != null ? L.s : 1);
  const kL = +dg.heSoLap, kB = +dg.heSoBienThe;

  if (mode === 'suat') {
    const muc  = mucCua(it, dg);
    const dong = DONG_CONCEPT[it.loai];
    const bangMuc = dong && dg.conceptMuc && dg.conceptMuc[dong];
    const q    = bangMuc && muc !== 'tay' ? +bangMuc[muc] || 0 : +it.q || 0;
    r.mucGia = bangMuc ? muc : null; r.qConcept = q;
    const nToa = it.ntoa != null ? +it.ntoa : 1;
    const nBt  = +it.nbt || 0;
    const cap  = it.capCT || L.capMD || 'I';
    const buoc = +it.buocTK === 3 ? 3 : 2;

    /* --- hệ số điều chỉnh vùng: tra QĐ 409 theo địa điểm dự án, hoặc nhập tay --- */
    const noi = duAn && duAn.diaDiem;
    if (it.autoVung !== false && noi) {
      const hv = traHeSoVung(noi, L.nhomVung);
      r.f = hv.f; r.vung = hv.vung; r.nguonVung = hv.nguon;
    } else {
      r.f = +it.f || 0; r.vung = 0;
      r.nguonVung = it.autoVung === false ? 'nhập tay' : 'chưa chọn địa điểm cho dự án';
    }
    const f = r.f;
    /* --- suất vốn đầu tư: tra QĐ 425 hoặc nhập tay --- */
    if (it.autoSuat !== false && L.bangQD) {
      const sv = traSuatVon(L.bangQD, {
        soTang: it.soTang, soHam: it.soHam, dtXD: it.dtXD,
        khoiCN: it.khoiCN, kieuNha: it.kieuNha, dienTichHa: it.dienTichHa, soHS: it.soHS, d,
      });
      r.g = sv.g; r.h = sv.h; r.nguonSV = sv.nguon;
      /* Suất vốn đầu tư: bảng theo m² sàn thì lấy thẳng; trường học QĐ chỉ công bố
         theo đầu cháu / học sinh nên đổi đơn vị và lấy quy mô là số học sinh. */
      if (sv.sv) { r.sv = sv.sv; r.nguonSv = sv.nguon; }
      else if (sv.svHS) { r.sv = sv.svHS; r.svDv = sv.svDv; r.nguonSv = sv.nguonSvHS; }
    } else {
      r.g = +it.g || 0; r.h = +it.h || 0; r.nguonSV = 'nhập tay';
    }

    /* Suất vốn đầu tư (QĐ 425) = chi phí xây dựng + thiết bị + QLDA + tư vấn + chi phí
       khác + VAT 10%. Không tham gia vào chuỗi tính chi phí thiết kế — để riêng, dùng
       cho những hợp đồng đòi báo giá theo suất đầu tư. Quy đổi về địa điểm bằng cùng
       hệ số vùng như chi phí xây dựng (QĐ 425, mục 3.1.4 → QĐ 409 Phần 4).
       Bảng khối chức năng (4, 6, 8, 16) không công bố cột này → cho khai tay.          */
    if (+it.svTay > 0) { r.sv = +it.svTay; r.svTay = true; r.nguonSv = 'khai tay cho hạng mục này'; }

    r.I   = r.g * f * d;                        // Tổng CP xây dựng
    r.J   = L.tbVung ? r.h * f * d : r.h * d;   // Tổng CP thiết bị
    r.K   = r.I + r.J;
    r.Lty = r.K / 1.1 / 1e9;                    // tỷ đồng, đã bóc VAT 10%
    r.svQuyMo = r.svDv === 'm² sàn' ? d : (+it.soHS || 0);
    r.svTong = r.sv * f * r.svQuyMo;            // tổng mức đầu tư ước theo suất vốn ĐT

    /* --- tỷ lệ định mức: tra TT 38 hoặc nhập tay ---
       Khoá tra dùng chung một giá trị L cho cả TKCS và TKBVTC, theo đúng
       cách làm của file gốc (đã chốt với người dùng 10/9/2026). */
    if (it.autoDinhMuc !== false) {
      const dm = traDinhMuc(r.Lty, L.nhomTT38 || 'danDung', cap, buoc);
      r.m = dm.tkcs.ty; r.n = dm.tkbvtc.ty; r.nkt = dm.tkkt.ty;
      r.nguonDM = dm;
    } else {
      r.m = +it.m || 0; r.n = +it.n || 0; r.nkt = +it.nkt || 0;
    }

    r.O   = r.K * r.m;      // TKCS   / tòa điển hình (trên XD+TB)
    r.PKT = r.I * r.nkt;    // TKKT   / tòa điển hình (chỉ trên XD, chỉ khi 3 bước)
    r.P   = r.I * r.n;      // TKBVTC / tòa điển hình (chỉ trên XD)

    /* Hạ tầng kỹ thuật KHÔNG nhân bản theo số tòa và KHÔNG có concept.
       File gốc "Tính định biên NS.xlsx", sheet "Cap nhat QH LBHN" hàng 14 (hạ tầng
       nội khu Đan Phượng) viết thẳng:  W = U×Q  ·  X = U×R , cột Concept để trống.
       Chuỗi nhân bản (Q + Q×0,2×(n−1) + Q×50% + …) × U chỉ có ở hàng công trình
       (hàng 6 cùng sheet). Hạ tầng là một mảnh đất, không có khái niệm "số tòa". */
    r.nhanBan = L.nhanBan !== false;
    r.hsNhanBan = r.nhanBan ? heSoNhanBan(nToa, nBt, kL, kB) : 1;
    r.hsConcept = r.nhanBan ? heSoConcept(nToa, nBt, kB) : 0;

    r.T   = q * r.hsConcept;          // đơn giá — không giảm
    r.U   = r.O   * r.hsNhanBan * s;
    r.UKT = r.PKT * r.hsNhanBan * s;
    r.V   = r.P   * r.hsNhanBan * s;
    r.cap = cap; r.buocTK = buoc;

    const dmc = r.nguonDM;
    r.dienGiai = [
      ['Suất vốn đầu tư', r.nguonSV, null, 'text'],
      ['Suất vốn đầu tư', r.sv ? (r.nguonSv || '') + ' — gồm cả QLDA, tư vấn, chi phí khác và VAT 10%'
        : 'QĐ 425 không công bố cho bảng khối chức năng này — khai tay nếu cần', r.sv],
      ['Tổng mức đầu tư (ước theo suất)', r.sv && r.svQuyMo
        ? `${fmt(r.sv)} đ/${r.svDv} × ${f} × ${fmt(r.svQuyMo)} ${r.svDv}`
        : r.sv ? `chưa khai số ${r.svDv}` : 'chưa có suất vốn đầu tư', r.svTong],
      ['Hệ số vùng', r.nguonVung, r.f, '×'],
      ['Tổng CP xây dựng (I)', `${fmt(r.g)} × ${f} × ${fmt(d)} m²`, r.I],
      ['Tổng CP thiết bị (J)', L.tbVung ? `${fmt(r.h)} × ${f} × ${fmt(d)} m²` : `${fmt(r.h)} × ${fmt(d)} m²`, r.J],
      ['XD + TB (K)', `${fmt(r.I)} + ${fmt(r.J)}`, r.K],
      ['Giá trị tra định mức (L)', `${fmt(r.K)} ÷ 1,1 ÷ 10⁹`, r.Lty, ' tỷ đ'],
      ['Tỷ lệ TKCS', dmc ? `Bảng ${dmc.tkcs.bang} · ${dmc.tkcs.ghi} · nội suy tại ${r.Lty.toFixed(2)} tỷ` : 'nhập tay', r.m, '%'],
      ['TKCS / tòa điển hình (O)', `${fmt(r.K)} × ${pct(r.m)}`, r.O],
    ];
    if (buoc === 3) r.dienGiai.push(
      ['Tỷ lệ TKKT', dmc ? `Bảng ${dmc.tkkt.bang} · ${dmc.tkkt.ghi}` : 'nhập tay', r.nkt, '%'],
      ['TKKT / tòa điển hình', `${fmt(r.I)} × ${pct(r.nkt)}`, r.PKT]);
    r.dienGiai.push(
      ['Tỷ lệ TKBVTC', dmc ? `Bảng ${dmc.tkbvtc.bang} · ${dmc.tkbvtc.ghi}` : 'nhập tay', r.n, '%'],
      ['TKBVTC / tòa điển hình (P)', `${fmt(r.I)} × ${pct(r.n)}`, r.P],
      r.nhanBan ? ['Hệ số nhân bản', dienGiaiNhanBan(nToa, nBt, kL, kB), r.hsNhanBan, '×']
                : ['Hệ số nhân bản', 'hạ tầng không nhân bản theo số tòa — file gốc viết thẳng U×Q, U×R', 1, '×'],
      r.nhanBan ? ['Concept (T)', `${fmt(q)} đ/mẫu × ${r.hsConcept} — đơn giá, không giảm`, r.T]
                : ['Concept (T)', 'hạ tầng không có concept — file gốc để trống cột này', 0],
      ['TKCS (U)', r.nhanBan ? `${fmt(r.O)} × ${r.hsNhanBan} × ${pct(s)}` : `${fmt(r.O)} × ${pct(s)}`, r.U]);
    if (buoc === 3) r.dienGiai.push(['TKKT', `${fmt(r.PKT)} × ${r.hsNhanBan} × ${pct(s)}`, r.UKT]);
    r.dienGiai.push(['TKBVTC (V)', r.nhanBan ? `${fmt(r.P)} × ${r.hsNhanBan} × ${pct(s)}` : `${fmt(r.P)} × ${pct(s)}`, r.V]);

  } else if (mode === 'thapTang') {
    const u = dg.thapTang[L.dg];
    const soMau = it.soMau != null ? +it.soMau : 1;

    /* Toàn bộ thấp tầng tính bằng ĐƠN GIÁ → giữ nguyên, không nhân hệ số giảm. */
    r.T = soMau * u.concept;
    r.U = d * u.tkcs;
    r.V = d * u.tkbvtc;
    // HSBH mặc định TẮT (file gốc để trống cột W). Bật bằng cờ wAuto.
    r.W = it.wAuto ? d * u.hsbh : (+it.w || 0);

    r.dienGiai = [
      ['Concept (T)', `${soMau} mẫu × ${fmt(u.concept)} đ/mẫu`, r.T],
      ['TKCS (U)',    `${fmt(d)} m² × ${fmt(u.tkcs)} đ/m²`, r.U],
      ['TKBVTC (V)',  `${fmt(d)} m² × ${fmt(u.tkbvtc)} đ/m²`, r.V],
      ['HSBH (W)',    it.wAuto ? `${fmt(d)} m² × ${fmt(u.hsbh)} đ/m²` : 'nhập tay', r.W],
    ];

  } else if (mode === 'canhQuan') {
    /* Đơn giá chung không hợp cho mọi khu cảnh quan — mỗi hạng mục nhập riêng được.
       Bỏ trống ô nhập tay thì quay về lấy đơn giá chung. */
    let muc = mucCua(it, dg);
    if (muc === 'tay') muc = 'giua';
    const bang  = (dg.canhQuan.muc && dg.canhQuan.muc[muc]) || dg.canhQuan;
    const kPho  = it.tuyenPho && !L.db ? (dg.canhQuan.tuyenPho != null ? +dg.canhQuan.tuyenPho : 0.4) : 1;
    const macC  = (L.db ? dg.canhQuan.dacBiet : bang.concept) * kPho;
    const macTC = (L.db ? dg.canhQuan.dacBiet : bang.tkbvtc) * kPho;
    r.mucGia = L.db ? null : muc; r.tuyenPho = kPho !== 1;
    const tay   = it.autoDonGia === false;
    const dgC   = tay ? num(it.dgConcept, macC)  : macC;
    const dgTC  = tay ? num(it.dgTkbvtc,  macTC) : macTC;
    r.dgTay = tay; r.dgC = dgC; r.dgTC = dgTC; r.dgChungC = macC; r.dgChungTC = macTC;
    /* Đơn giá → giữ nguyên. File gốc hàng 30 nhân thêm 30% (cột "tỷ lệ nhân công"),
       bỏ từ 7/10/2026: cái gì tính bằng đơn giá thì không giảm. */
    r.T = d * dgC;
    r.V = d * dgTC;
    r.dienGiai = [
      ['Đơn giá', tay ? `nhập tay riêng cho hạng mục này (chung: ${fmt(macC)} · ${fmt(macTC)} đ/m²)`
                      : `đơn giá chung${L.db ? ' — cảnh quan đặc biệt' : ` — mức ${MUC_GIA[muc].ten}`}${kPho !== 1 ? ` × ${pct(kPho)} tuyến phố` : ''}`, null, 'text'],
      ['Concept (T)', `${fmt(d)} m² × ${fmt(dgC)} đ/m²`, r.T],
      ['TKBVTC (V)',  `${fmt(d)} m² × ${fmt(dgTC)} đ/m²`, r.V],
    ];

  } else if (mode === 'khac') {
    /* Không tra bảng gì cả — người dùng nhập thẳng số tiền rồi chọn nó thuộc
       giai đoạn nào. Quy mô m² sàn vẫn khai được để còn cộng vào tổng sàn. */
    const gd = giaiDoanKhac(it);
    r.gdKhac = gd;
    r[gd] = +it.tienKhac || 0;
    r.dienGiai = [
      ['Cách tính', 'nhập tay — loại "Khác"', null, 'text'],
      [`${TEN_KHOAN[gd]} (${gd})`, 'số tiền người dùng nhập', r[gd]],
    ];

  } else if (mode === 'noiThat') {
    /* Trọn gói theo mức — diện tích chỉ để ghi nhận quy mô, KHÔNG nhân vào tiền. */
    const m = MUC_GIA[it && it.mucGia] ? it.mucGia : (MUC_GIA[dg.mucMacDinh] ? dg.mucMacDinh : 'giua');
    const u = (dg.noiThat.muc || {})[m] || { concept: 0, tkbvtc: 0 };

    r.mucGia = m;
    r.T = +u.concept || 0;
    r.V = +u.tkbvtc || 0;
    r.dienGiai = [
      ['Mức đơn giá', MUC_GIA[m].ten + ' — trọn gói, không nhân diện tích, không giảm', null, 'text'],
      ['Quy mô ghi nhận', `${fmt(d)} m² sàn`, null, 'text'],
      ['Concept (T)', 'trọn gói', r.T],
      ['TKBVTC (V)',  'trọn gói', r.V],
    ];
  }

  if (mode !== 'thapTang' && mode !== 'khac') r.W = +it.w || 0;

  /* --- khoản bị tắt: giữ giá trị gốc lại rồi ép về 0 --- */
  r.goc = {}; r.tat = {};
  for (const k of KHOAN) { r.goc[k] = r[k]; if ((r.tat[k] = !!(it.tat && it.tat[k]))) r[k] = 0; }
  r.soTat = KHOAN.filter((k) => r.tat[k]).length;

  r.X = r.U + r.UKT + r.V + r.W;

  /* --- nhân công & định biên (cột Z..AI của file) --- */
  r.Z = r.T * y; r.AA = r.U * y; r.AAKT = r.UKT * y; r.AB = r.V * y;

  const tC  = num(it.thangC,  dg.thangMacDinh.concept);
  const tCS = num(it.thangCS, dg.thangMacDinh.tkcs);
  const tKT = num(it.thangKT, dg.thangMacDinh.tkkt);
  const tTC = num(it.thangTC, dg.thangMacDinh.tkbvtc);
  const luong = +dg.luongTB || 1;
  const db = (v, tien, thang) => (v != null && v !== '' ? +v : (thang ? ru(tien / thang / luong) : 0));

  r.AF   = r.tat.T   ? 0 : db(it.dbC,  r.Z,    tC);
  r.AG   = r.tat.U   ? 0 : db(it.dbCS, r.AA,   tCS);
  r.AGKT = r.tat.UKT ? 0 : db(it.dbKT, r.AAKT, tKT);
  r.AH   = r.tat.V   ? 0 : db(it.dbTC, r.AB,   tTC);
  r.AI   = r.AF + r.AG + r.AGKT + r.AH;

  if (r.soTat) r.dienGiai.push(['Khoản đang TẮT',
    KHOAN.filter((k) => r.tat[k]).map((k) => `${TEN_KHOAN[k]} ${fmt(r.goc[k])} đ`).join('  ·  '),
    null, 'text']);

  r.y = y; r.s = s;
  r.thangC = tC; r.thangCS = tCS; r.thangKT = tKT; r.thangTC = tTC;
  return r;
}

function dienGiaiNhanBan(nToa, nBt, kL, kB) {
  nBt = Math.min(Math.max(0, nBt | 0), Math.max(0, nToa | 0));
  const nDH = (nToa | 0) - nBt, lapDH = Math.max(0, nDH - 1), lapBT = Math.max(0, nBt - 1);
  const p = [];
  if (nDH > 0) p.push('1');
  if (lapDH)   p.push(`${kL}×${lapDH}`);
  if (nBt > 0) p.push(`${kB}`);
  if (lapBT)   p.push(`${kB}×${kL}×${lapBT}`);
  return (p.join(' + ') || '0') + `   (${nToa} tòa, ${nBt} biến thể)`;
}

/* ---------- Tổng hợp toàn dự án ------------------------------------------- */
/* svTong = tổng mức đầu tư ước theo suất vốn đầu tư QĐ 425 — chỉ để báo giá,
   không tham gia chuỗi tính chi phí thiết kế. */
const CTONG = ['T', 'U', 'UKT', 'V', 'W', 'X', 'Z', 'AA', 'AAKT', 'AB', 'AF', 'AG', 'AGKT', 'AH', 'AI', 'svTong'];

function tinhDuAn(duAn, dg) {
  const rows = (duAn.items || []).map((it) => ({ it, r: tinhHangMuc(it, dg, duAn) }));
  const tong = Object.fromEntries(CTONG.map((k) => [k, 0]));
  tong.D = 0;
  const theoPK = {}, theoNhom = {};

  for (const { it, r } of rows) {
    for (const k of CTONG) tong[k] += r[k];
    tong.D += +it.d || 0;

    const pk = it.pk == null || it.pk === '' ? '—' : String(it.pk);
    (theoPK[pk] ||= { T: 0, X: 0, AI: 0, D: 0, n: 0 });
    (theoNhom[r.nhom] ||= { T: 0, X: 0, AI: 0, D: 0, n: 0 });
    for (const bag of [theoPK[pk], theoNhom[r.nhom]]) {
      bag.T += r.T; bag.X += r.X; bag.AI += r.AI; bag.D += +it.d || 0; bag.n++;
    }
  }
  tong.tongCong = tong.X + tong.T;
  return { duAn, rows, tong, theoPK, theoNhom,
           vung: traVung(duAn.diaDiem),
           coTKKT: rows.some(({ r }) => r.UKT > 0) };
}

/* ---------- Tổng hợp toàn bộ kho dự án ------------------------------------ */
function tinhKho(kho) {
  const dg = kho.donGia;
  const ds = kho.duAns.map((d) => tinhDuAn(d, dg));
  const tong = Object.fromEntries(CTONG.map((k) => [k, 0]));
  tong.D = 0;
  const theoNhom = {};

  for (const kq of ds) {
    for (const k of CTONG) tong[k] += kq.tong[k];
    tong.D += kq.tong.D;
    for (const [nh, v] of Object.entries(kq.theoNhom)) {
      (theoNhom[nh] ||= { T: 0, X: 0, AI: 0, D: 0, n: 0 });
      for (const k of ['T', 'X', 'AI', 'D', 'n']) theoNhom[nh][k] += v[k];
    }
  }
  tong.tongCong = tong.X + tong.T;
  return { ds, tong, theoNhom,
           coTKKT: ds.some((k) => k.coTKKT),
           tuyenThem: Math.max(0, tong.AI - (+dg.nstkHienTai || 0)) };
}

/* ---------- tiện ích ------------------------------------------------------ */
const num = (v, d) => (v === '' || v == null || !isFinite(+v) ? d : +v);
const fmt = (n) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Math.round(+n || 0));
const pct = (n) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 4 }).format((+n || 0) * 100) + '%';

  if (it && it.nhomBM && TY_LE_BO_MON[it.nhomBM]) return it.nhomBM;
  const loai = it && it.loai;
  if (LA_THAP_TANG[loai] && it && it.goiTT && TY_LE_BO_MON[it.goiTT]) return it.goiTT;

function chuanHoaTyLe(cot) {
  const ra = { ty: {}, tong: 0, lech: false };
  if (!cot) return ra;
  for (const k of Object.keys(cot)) ra.tong += +cot[k] || 0;
  if (ra.tong <= 0) return ra;
  ra.lech = Math.abs(ra.tong - 100) > 0.0001;
  for (const k of Object.keys(cot)) ra.ty[k] = (+cot[k] || 0) / ra.tong;
  return ra;
}

     tongTien, lechCot: [tên cột lệch 100%]
   }                                                                         */
function phanBoBoMon(it, r) {
  const nhom = nhomBoMon(it);
  const b = TY_LE_BO_MON[nhom] || {};
  const ra = {
    nhom, nhomTen: b.ten || nhom, ghiChu: b.ghiChu || '',
    doanHo: !!(NHOM_DOAN_HO[it && it.loai] && !(it && it.nhomBM)),
    tien: {}, theoKhoan: { T: {}, U: {}, UKT: {}, V: {}, W: {} },
    tongTien: 0, lechCot: [], thieuCot: [],
    /* Nhóm do một phòng chủ trì: tiền về phòng đó, còn vaiTro là cách chia
       việc BÊN TRONG phòng (dùng để biết trong phòng cần mấy người mảng nào) */
    phong: b.phong || null, vaiTroTen: b.vaiTroTen || null, vaiTro: {},
  };
  for (const k of BO_MON_KEY) ra.tien[k] = 0;

  /* Khoản tiền nào lấy cột tỷ lệ nào.
     TKCS và TKKT của hạng mục HTKT dùng cột riêng (hoSoCS) vì bản gốc tách.
     Bốn nhóm trong bản gốc KHÔNG có cột "TK concept" (công trình tạm kỹ thuật,
     trạm sạc, hai nhóm HTKT). Nếu cứ bỏ qua thì tiền Concept của chúng biến mất
     khỏi bảng bộ môn — nên lấy tạm cột Hồ sơ và ghi dấu vào thieuCot để UI
     cảnh báo, chứ tuyệt đối không nuốt tiền. */
  const cap = [
    ['T',   b.concept || b.hoSo,      'TK concept',       !b.concept],
    ['U',   b.hoSoCS || b.hoSo,       b.hoSoCS ? 'Hồ sơ TKCS/TKKT' : 'Hồ sơ TKCS+TKBVTC', false],
    ['UKT', b.hoSoCS || b.hoSo,       b.hoSoCS ? 'Hồ sơ TKCS/TKKT' : 'Hồ sơ TKCS+TKBVTC', false],
    ['V',   b.hoSo,                   'Hồ sơ TKCS+TKBVTC', false],
    ['W',   b.hsbh || b.hoSo,         b.hsbh ? 'Hồ sơ bán hàng' : 'Hồ sơ TKCS+TKBVTC', !b.hsbh],
  ];

  for (const [khoan, cot, tenCot, muon] of cap) {
    const tien = +(r && r[khoan]) || 0;
    if (!tien) continue;
    const c = chuanHoaTyLe(cot);
    if (!c.tong) continue;                       // nhóm này không có cột nào dùng được
    if (muon && !ra.thieuCot.includes(tenCot)) ra.thieuCot.push(tenCot);
    if (c.lech && !ra.lechCot.includes(tenCot)) ra.lechCot.push(`${tenCot} (${c.tong}%)`);
    if (b.phong) {
      /* Cả khoản tiền này thuộc về một phòng; bảng tỷ lệ chỉ chia vai trò. */
      ra.theoKhoan[khoan][b.phong] = (ra.theoKhoan[khoan][b.phong] || 0) + tien;
      ra.tien[b.phong] += tien;
      ra.tongTien += tien;
      for (const vt of Object.keys(c.ty)) ra.vaiTro[vt] = (ra.vaiTro[vt] || 0) + tien * c.ty[vt];
      continue;
    }
    for (const bm of Object.keys(c.ty)) {
      const v = tien * c.ty[bm];
      ra.theoKhoan[khoan][bm] = v;
      ra.tien[bm] += v;
      ra.tongTien += v;
    }
  }
  return ra;
}

/* ---------- định biên từng bộ môn ----------------------------------------
   Bám đúng công thức định biên sẵn có của tool: ROUNDUP(tiền nhân công ÷ số
   tháng ÷ lương). Chỉ khác ở chỗ tiền đã tách theo bộ môn trước khi chia.

   @param r   kết quả tinhHangMuc() — cần y (tỷ lệ nhân công) và số tháng
   @param pb  kết quả phanBoBoMon()
   @param dg  bộ đơn giá — lấy luongTB (tinhHangMuc không trả về lương)
   @return { theoKhoan: {T:{KT:n,…},…}, tong: {KT:n,…}, tongNguoi }           */
function dinhBienBoMon(r, pb, dg) {
  const luong = +(dg && dg.luongTB) || 0;
  const y = +(r && r.y) || 0;
  const thang = { T: r.thangC, U: r.thangCS, UKT: r.thangKT, V: r.thangTC, W: 0 };
  const ru = (x) => (isFinite(x) && x > 0 ? Math.ceil(x - 1e-9) : 0);

  const ra = { theoKhoan: { T: {}, U: {}, UKT: {}, V: {}, W: {} },
               tong: {}, le: {}, tongNguoi: 0 };
  for (const k of BO_MON_KEY) { ra.tong[k] = 0; ra.le[k] = 0; }
  if (!luong) return ra;                         // chưa biết lương thì không đoán

  for (const khoan of ['T', 'U', 'UKT', 'V']) {
    const t = +thang[khoan] || 0;
    if (!t) continue;
    for (const [bm, tien] of Object.entries(pb.theoKhoan[khoan] || {})) {
      const le = tien * y / t / luong;            // số người chưa làm tròn
      ra.le[bm] += le;
      const n = ru(le);
      if (!n) continue;
      ra.theoKhoan[khoan][bm] = n;
      ra.tong[bm] += n;
      ra.tongNguoi += n;
    }
  }
  return ra;
}

/* ---------- định biên GỘP cho cả dự án / cả kho --------------------------
   Vì sao phải có hàm riêng: nếu làm tròn lên ở từng hạng mục rồi mới cộng thì
   mỗi hạng mục dù chỉ cần 0,04 người PCCC vẫn thành 1 người. Với 27 hạng mục,
   PCCC bị thổi lên 74 người cho 6,6 tỷ — không dùng để lên kế hoạch được.

   Nên: cộng phần LẺ của mọi hạng mục trước, làm tròn lên MỘT LẦN ở cuối. Đó
   mới là số người cần huy động đồng thời cho cả dự án.

   @param ds  [{ r, pb }] — kết quả tinhHangMuc + phanBoBoMon của từng hạng mục
   @param dg  bộ đơn giá (lấy luongTB)                                        */
function dinhBienGop(ds, dg) {
  const ru = (x) => (isFinite(x) && x > 0 ? Math.ceil(x - 1e-9) : 0);
  const le = {}, nguoi = {};
  for (const k of BO_MON_KEY) { le[k] = 0; nguoi[k] = 0; }
  for (const x of ds) {
    const db = x.db || dinhBienBoMon(x.r, x.pb, dg);
    for (const k of BO_MON_KEY) le[k] += db.le[k] || 0;
  }
  let tong = 0;
  for (const k of BO_MON_KEY) { nguoi[k] = ru(le[k]); tong += nguoi[k]; }
  return { le, nguoi, tongNguoi: tong };
}

/* =============================================================================
   Cầu nối cho app Sản lượng VTK
   App đó không có "hạng mục" mà có "công việc", phân loại bằng loaiHinh + buoc.
   Quy về đúng bộ máy phân bổ ở trên để không phải viết lại lần hai.
   ========================================================================== */
const NHOM_TU_LOAI_HINH = {
  CAO: 'caoTang', TTTM: 'caoTang', TRUONG: 'truongHoc',
  'TT-LK': 'thapTho', 'TT-BT': 'thapTho',          // gói hoàn thiện đổi tay được
  NT: 'noiThat', CQ: 'canhQuan', HTKT: 'htkt',
  DB: 'caoTang',          // công trình đặc biệt — mặc định, sửa được
  TB: null,               // cung cấp thiết bị: không phải việc thiết kế
  KHAC: 'caoTang',        // mặc định, sửa được
};
/* Loại hình app phải ĐOÁN hộ tỷ lệ (bảng gốc không có loại này) — màn hình nói rõ
   ra để người dùng còn khai lại nhóm cho đúng. */
const LOAI_HINH_DOAN = { KHAC: 1, DB: 1 };
/* Bước thiết kế rơi vào khoản tiền nào của bộ máy gốc */
const KHOAN_TU_BUOC = {
  CONCEPT: 'T', TLBH: 'W',
  TKCS: 'U', TKKT: 'U', TKBVTC: 'V',
  // NVTK, GPXD, THICONG, THIETBI, HOPDONG, KHAC → coi như phần hồ sơ
};

/**
 * Phân bổ sản lượng của MỘT công việc (app Sản lượng VTK) ra các phòng.
 * @param cv   công việc — dùng loaiHinh, buoc, và nhomBM/goiTT nếu khai tay
 * @param tien chi phí THIẾT KẾ của công việc (không gồm QLTK — QLTK là việc
 *             của bộ phận quản lý thiết kế, không chia theo bộ môn triển khai)
 */
function phanBoCongViec(cv, tien) {
  const nhom = (cv && cv.nhomBM) || NHOM_TU_LOAI_HINH[cv && cv.loaiHinh];
  if (!nhom || !(+tien)) return null;             // TB, hoặc chưa ra tiền
  const khoan = KHOAN_TU_BUOC[cv && cv.buoc] || 'V';
  const r = { T: 0, U: 0, UKT: 0, V: 0, W: 0 };
  r[khoan] = +tien;
  const ra = phanBoBoMon({ loai: null, nhomBM: nhom, goiTT: cv && cv.goiTT }, r);
  if (!(cv && cv.nhomBM) && LOAI_HINH_DOAN[cv && cv.loaiHinh]) ra.doanHo = true;
  return ra;
}

/* =============================================================================
   Định biên cho app chưa có bộ máy chi phí đầy đủ (Sản lượng VTK, TMB quy hoạch)

   Hai app đó không có r.y và r.thangC… như tool Chi phí thiết kế, nên khai thẳng
   một bộ tham số nhân sự dùng chung cho cả kho. Công thức vẫn y nguyên:
       số người = tiền bộ môn × tỷ lệ nhân công ÷ số tháng ÷ lương tháng
   Mặc định lấy đúng số của tool Chi phí thiết kế (lương 43 tr, nhân công 30%,
   concept 2 · TKCS 4 · TKKT 5 · TKBVTC 6 tháng).

   Hồ sơ bán hàng để 0 tháng = KHÔNG tính định biên, giống tool gốc. Tiền của
   khoản không khai tháng được trả về ở 'chuaTinh' để màn hình nói rõ ra, chứ
   không âm thầm bỏ.                                                          */
function nhanSuMacDinh() {
  return { luongTB: 43e6, tyLeNhanCong: 0.30, thang: { T: 2, U: 4, UKT: 5, V: 6, W: 0 } };
}

/**
 * @param ns  { luongTB, tyLeNhanCong, thang:{T,U,UKT,V,W} } — số tháng của TỪNG BƯỚC,
 *            dùng cho bản tính theo DỰ ÁN (mỗi bước là một mốc giao hồ sơ riêng);
 *            hoặc { luongTB, tyLeNhanCong, thangKy } — một mốc chung cho CẢ KỲ,
 *            dùng cho bản tính theo KỲ KẾ HOẠCH (sản lượng cả năm). thangKy có thì
 *            đè lên thang.
 *
 *            Chia theo bước cho một bảng sản lượng cả năm là SAI nặng: 7,3 tỷ cảnh
 *            quan chia cho 2–6 tháng ra 20 người, trong khi cả năm chỉ cần 5.
 * @return { le: {bm: số người chưa làm tròn}, chuaTinh: tiền chưa ra được định biên }
 */
function leDinhBien(pb, ns) {
  const le = {};
  for (const k of BO_MON_KEY) le[k] = 0;
  let chuaTinh = 0;
  const luong = +(ns && ns.luongTB) || 0;
  const y = +(ns && ns.tyLeNhanCong) || 0;
  const thang = (ns && ns.thang) || {};
  const ky = +(ns && ns.thangKy) || 0;
  for (const khoan of ['T', 'U', 'UKT', 'V', 'W']) {
    const t = ky || (+thang[khoan] || 0);
    for (const [bm, tien] of Object.entries((pb && pb.theoKhoan[khoan]) || {})) {
      if (!t || !luong || !y) { chuaTinh += tien; continue; }
      le[bm] += tien * y / t / luong;
    }
  }
  return { le, chuaTinh };
}

/** Cộng phần lẻ của mọi việc rồi làm tròn lên MỘT lần cho mỗi bộ môn. */
function gopDinhBien(dsLe) {
  const le = {}, nguoi = {};
  for (const k of BO_MON_KEY) { le[k] = 0; nguoi[k] = 0; }
  for (const x of dsLe) for (const k of BO_MON_KEY) le[k] += (x && x[k]) || 0;
  let tong = 0;
  for (const k of BO_MON_KEY) { nguoi[k] = isFinite(le[k]) && le[k] > 0 ? Math.ceil(le[k] - 1e-9) : 0; tong += nguoi[k]; }
  return { le, nguoi, tongNguoi: tong };
}

/* ---------- cộng dồn nhiều hạng mục -------------------------------------- */
function congBoMon(ds) {
  const ra = { tien: {}, nguoi: {}, tongTien: 0, tongNguoi: 0 };
  for (const k of BO_MON_KEY) { ra.tien[k] = 0; ra.nguoi[k] = 0; }
  for (const x of ds) {
    for (const k of BO_MON_KEY) {
      ra.tien[k] += (x.pb && x.pb.tien[k]) || 0;
      ra.nguoi[k] += (x.db && x.db.tong[k]) || 0;
    }
  }
  ra.tongTien = BO_MON_KEY.reduce((a, k) => a + ra.tien[k], 0);
  ra.tongNguoi = BO_MON_KEY.reduce((a, k) => a + ra.nguoi[k], 0);
  return ra;
}

if (typeof module !== 'undefined') {
  module.exports = { BO_MON, BO_MON_KEY, TY_LE_BO_MON, GOI_THAP_TANG, NHOM_MAC_DINH,
    NHOM_DOAN_HO, LA_THAP_TANG, nhomBoMon, chuanHoaTyLe, phanBoBoMon, dinhBienBoMon,
    dinhBienGop, congBoMon, NHOM_TU_LOAI_HINH, KHOAN_TU_BUOC, phanBoCongViec,
    nhanSuMacDinh, leDinhBien, gopDinhBien, LOAI_HINH_DOAN };
}

<script>
/* =============================================================================
   xlsx.js — Ghi file .xlsx thuần JavaScript, không thư viện, chạy offline.

   Bố cục, phông chữ, màu sắc, độ rộng cột, chiều cao hàng và định dạng số đều
   sao đúng theo file "Tính toán chi phí thiết kế dự án.xlsx" (sheet LBHN 260904):
     · Arial 11 toàn bộ
     · chữ #002060 cho ô công thức, #FF0000 cho ô nhập tay, #000000 cho cột E
     · nền #DEEAF6 hàng tiêu đề · #E2F0D9 hàng nhóm · #DAE3F3 cột Phân kỳ
       · #FFFF00 ô tổng · #FFF2CC băng hàng 1
     · bốn cột tra bảng G, H, M, N để chữ #002060, không tô nền: nền vàng chữ đỏ
       trong file gốc chỉ là dấu đánh tay để phân biệt, không phải định dạng chính thức
     · viền thin đen toàn bộ vùng bảng, bỏ lưới nền, thu phóng 85%
   ZIP dùng phương thức "store" (không nén) — Excel đọc bình thường.
   ========================================================================== */
'use strict';

/* ---------- CRC32 ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const utf8 = (s) => new TextEncoder().encode(s);

/* ---------- ZIP (store-only) ---------- */
function zip(files) {
  const enc = files.map((f) => {
    const name = utf8(f.name), data = typeof f.data === 'string' ? utf8(f.data) : f.data;
    return { name, data, crc: crc32(data) };
  });
  const chunks = [], central = [];
  let offset = 0;

  for (const e of enc) {
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);        // bit 11: tên file UTF-8
    h.setUint16(8, 0, true);             // method 0 = store
    h.setUint16(10, 0, true); h.setUint16(12, 0x2821, true);
    h.setUint32(14, e.crc, true);
    h.setUint32(18, e.data.length, true);
    h.setUint32(22, e.data.length, true);
    h.setUint16(26, e.name.length, true);
    h.setUint16(28, 0, true);
    chunks.push(new Uint8Array(h.buffer), e.name, e.data);

    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x2821, true);
    c.setUint32(16, e.crc, true);
    c.setUint32(20, e.data.length, true);
    c.setUint32(24, e.data.length, true);
    c.setUint16(28, e.name.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), e.name);
    offset += 30 + e.name.length + e.data.length;
  }

  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, enc.length, true); eo.setUint16(10, enc.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);

  const all = [...chunks, ...central, new Uint8Array(eo.buffer)];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
  let p = 0;
  for (const a of all) { out.set(a, p); p += a.length; }
  return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---------- XML ---------- */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                            .replace(/"/g, '&quot;').replace(/\r/g, '');
const colLetter = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };

/* =============================================================================
   Bảng kiểu — dựng động, chỉ sinh ra những tổ hợp thực sự dùng
   ========================================================================== */
const FONT = {                                   // màu chữ theo file gốc
  navy:  { c: 'FF002060', b: 0 }, navyB: { c: 'FF002060', b: 1 },
  red:   { c: 'FFFF0000', b: 0 }, redB:  { c: 'FFFF0000', b: 1 },
  den:   { c: 'FF000000', b: 0 },
};
const FILL = {
  none:   null,
  header: 'FFDEEAF6',   // hàng tiêu đề cột
  nhom:   'FFE2F0D9',   // hàng nhóm I / II / III      (theme accent6, tint 0,8)
  pk:     'FFDAE3F3',   // cột Phân kỳ, đầu mục a–g    (theme accent1, tint 0,8)
  vang:   'FFFFFF00',   // ô tổng
  bang1:  'FFFFF2CC',   // băng gộp ở hàng 1           (theme accent4, tint 0,8)
};
const FMT = {
  chung: 'General',
  ng:    '#,##0',
  pc2:   '0.00%',
  pc0:   '0%',
  acc2:  '_(* #,##0_);_(* \\(#,##0\\);_(* "-"??_);_(@_)',
  acc3:  '_(* #,##0_);_(* \\(#,##0\\);_(* "-"???_);_(@_)',
  acc2d: '_(* #,##0.00_);_(* \\(#,##0.00\\);_(* "-"???_);_(@_)',
};

/** Gom các kiểu ô đã dùng lại thành cellXfs; trả về chỉ số kiểu. */
function moKho() {
  const ds = [], map = new Map();
  const S = (o) => {
    o = o || {};
    const k = `${o.fmt || 'chung'}|${o.f || 'navy'}|${o.fill || ''}|${o.bd ? 1 : 0}|${o.h || ''}|${o.v || 'center'}|${o.wrap ? 1 : 0}`;
    if (map.has(k)) return map.get(k);
    const i = ds.push(o) - 1;
    map.set(k, i);
    return i;
  };
  return { ds, S };
}

function stylesXml(xfs) {
  const fonts = Object.values(FONT);
  const fontIdx = Object.fromEntries(Object.keys(FONT).map((k, i) => [k, i]));
  const fillKeys = ['none', 'gray', ...Object.keys(FILL).filter((k) => FILL[k])];
  const fillIdx = Object.fromEntries(fillKeys.map((k, i) => [k, i]));
  const fmtKeys = Object.keys(FMT).filter((k) => k !== 'chung');
  const fmtId = Object.fromEntries(fmtKeys.map((k, i) => [k, 164 + i]));

  const xfXml = xfs.map((o) => {
    const al = [];
    if (o.h) al.push(`horizontal="${o.h}"`);
    al.push(`vertical="${o.v || 'center'}"`);
    if (o.wrap) al.push('wrapText="1"');
    const nf = o.fmt && o.fmt !== 'chung' ? fmtId[o.fmt] : 0;
    return `<xf numFmtId="${nf}" fontId="${fontIdx[o.f || 'navy']}" fillId="${o.fill ? fillIdx[o.fill] : 0}"`
         + ` borderId="${o.bd ? 1 : 0}" xfId="0" applyFont="1" applyAlignment="1"`
         + `${nf ? ' applyNumberFormat="1"' : ''}${o.fill ? ' applyFill="1"' : ''}${o.bd ? ' applyBorder="1"' : ''}>`
         + `<alignment ${al.join(' ')}/></xf>`;
  }).join('');

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="${fmtKeys.length}">${fmtKeys.map((k) => `<numFmt numFmtId="${fmtId[k]}" formatCode="${esc(FMT[k])}"/>`).join('')}</numFmts>
<fonts count="${fonts.length}">${fonts.map((f) =>
  `<font><sz val="11"/><name val="Arial"/><family val="2"/><color rgb="${f.c}"/>${f.b ? '<b/>' : ''}</font>`).join('')}</fonts>
<fills count="${fillKeys.length}">
<fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
${fillKeys.slice(2).map((k) => `<fill><patternFill patternType="solid"><fgColor rgb="${FILL[k]}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}
</fills>
<borders count="2">
<border><left/><right/><top/><bottom/><diagonal/></border>
<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>
</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${xfXml}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
}
